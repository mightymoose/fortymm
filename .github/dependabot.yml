version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native port and drops the JS compiler API that our
      # toolchain builds on: typescript-eslint declares `typescript <6.1.0` and
      # openapi-typescript still calls `ts.factory`, so both `npm run lint` and
      # `npm run gen:api` die on it. Drop this once typescript-eslint ships a
      # release whose peer range admits 7.x.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # @tanstack/react-router 1.170.19 shipped a breaking rewrite as a semver
      # patch ("lane-based scheduler"), and it drops a `beforeLoad` redirect
      # unless the caller awaits `router.load()` before rendering. `main.tsx`
      # renders `<RouterProvider>` directly, like the docs show, so a returning
      # user hitting `/` stays on the landing page instead of going to
      # `/dashboard`. Measured in a real browser: 1.170.18 lands on
      # `/dashboard`, 1.170.20 stays on `/`. Still broken on 1.170.25.
      # Drop this once upstream restores the redirect, or once we decide to
      # await the initial load at bootstrap. Tracked in #1344.
      - dependency-name: "@tanstack/react-router"
        versions:
          - ">=1.170.19"
    groups:
      web-client-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      e2e-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /web-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
