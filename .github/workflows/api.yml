name: api

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: api

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - run: pip install -e '.[dev]'

      - run: pytest
