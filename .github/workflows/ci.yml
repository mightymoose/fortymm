# Every job is a checkout plus ./bin/mise run <task>: the same command, in the
# same Compose stack, that reproduces it on a laptop. Nothing else is installed
# on the runner; it needs only Docker and bash.
#
# Stage 1, validate: each app's <app>:validate, one matrix job per app (for
#                    web-client this includes its Playwright suite); and
#   openapi-breaking: each <app>:openapi-breaking against the base commit, for
#                    apps with an OpenAPI document.
# Stage 2, e2e:      each <app>:e2e, one matrix job per app with a suite, once
#                    every app is valid. Each job stands up its own copy of the
#                    servers on its own runner, so suites can't share state.
# ci-passed:         the one check to require on main. Its name stays fixed as
#                    apps and stages are added.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a pull request, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry per app; each must have an <app>:validate task.
        app:
          - web-client
          - api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run ${{ matrix.app }}:validate
        env:
          APP: ${{ matrix.app }}
        run: ./bin/mise run "$APP:validate"
      # An app whose validate runs a browser suite (web-client/e2e/).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validate-report-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/playwright-report/
            ${{ matrix.app }}/test-results/
          if-no-files-found: ignore
          retention-days: 14

  openapi-breaking:
    name: openapi-breaking (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # One entry per app with an OpenAPI document; each must have an
        # <app>:openapi-breaking task.
        app:
          - api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD and its first parent. On a pull request HEAD is GitHub's merge
          # commit, whose first parent is the base branch; on a push to main it
          # is main before the push. Either way HEAD^ is what clients rely on.
          fetch-depth: 2
      - name: ./bin/mise run ${{ matrix.app }}:openapi-breaking -- HEAD^
        env:
          APP: ${{ matrix.app }}
        run: ./bin/mise run "$APP:openapi-breaking" -- "HEAD^"

  e2e:
    name: e2e (${{ matrix.app }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry per app with an end-to-end suite; each must have an
        # <app>:e2e task. A client that needs another runner (iOS: macOS) moves
        # this to `include:` entries with an `os` and runs-on: ${{ matrix.os }}.
        # web-client's suite runs in its validate job instead.
        app:
          - api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run ${{ matrix.app }}:e2e
        env:
          APP: ${{ matrix.app }}
        run: ./bin/mise run "$APP:e2e"
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.app }}
          path: |
            e2e/${{ matrix.app }}/playwright-report/
            e2e/${{ matrix.app }}/test-results/
          if-no-files-found: ignore
          retention-days: 14

  ci-passed:
    name: ci-passed
    needs: [validate, openapi-breaking, e2e]
    # Run even when a stage failed or was skipped, so this check always reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every stage to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
