# Every job is a checkout plus ./bin/mise run <task>: the same command, in the
# same Compose stack, that reproduces it on a laptop. Nothing else is installed
# on the runner; it needs only Docker and bash.
#
# Stage 1, validate: each app's <app>:validate, one matrix job per app:
#                    everything the app can prove by itself (api's includes
#                    its shipped image against its database, web-client's
#                    its production build in a real browser); and
#   openapi-breaking: each <app>:openapi-breaking against the base commit, for
#                    apps with an OpenAPI document; and
#   workflows:       the workflows task: actionlint, the permission rules
#                    below (.github/scripts/check-workflows.sh), and the tests
#                    of the scripts the workflows run.
# Stage 2, e2e:      the stack-wide e2e task: one job for the cross-app suite in
#                    e2e/ (what can fail only because of how the apps are
#                    served or connected), once every app is valid. One suite,
#                    so no matrix.
# preview:           on a pull request from this repository, after preview-api:
#                    web-client:preview, the pull request's build to its own
#                    Worker on Cloudflare (fortymm-pr-<number>), forwarding
#                    /api/* to the pull request's api (preview-api's address),
#                    then the hosting checks against it. Skipped where there
#                    are no secrets (a fork, Dependabot), and when preview-api
#                    failed.
# preview-api:       on the same pull requests: api:preview, the pull request's
#                    api to its own Cloud Run service on Google Cloud
#                    (fortymm-api-pr-<number>) with its own database
#                    (pr_<number>), then api's end-to-end suite against it.
#                    It signs in through Workload Identity Federation (no
#                    stored key), so it is the only job here with
#                    id-token: write. Skipped where the web client's preview
#                    is, for the same reasons.
# preview-comment:   on the same pull requests, after both previews (even when
#                    one failed): one comment on the pull request with their
#                    addresses, which the previews pass as job outputs,
#                    updated in place on every push. Not a merge gate:
#                    ci-passed doesn't need it.
# ci-passed:        the one check to require on main. Its name stays fixed as
#                    apps and stages are added.
# deploy:            on a push to main, after ci-passed: web-client:deploy, the
#                    web client to its production Worker on Cloudflare. Nothing
#                    is tested against production; the preview was.
# The preview, the deploy, and preview-cleanup.yml (which deletes a pull
# request's previews when it closes) are the only jobs with the Cloudflare
# secrets; preview-api and preview-cleanup.yml's api job are the only ones that
# can become Google Cloud's api-preview-deployer. preview-comment alone may
# write on a pull request (pull-requests: write), and it holds neither: no
# secret, no id-token, no checkout of the pull request's code. So no job can
# both deploy and write on the pull request, and code from a pull request
# never runs with the write token. .github/scripts/check-workflows.sh (the
# workflows job) fails if any of this changes. Pull requests run on
# pull_request, never pull_request_target, so a fork's code never runs with
# either.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a pull request, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry per app; each must have an <app>:validate task.
        app:
          - web-client
          - api
          - core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run ${{ matrix.app }}:validate
        env:
          APP: ${{ matrix.app }}
        run: ./bin/mise run "$APP:validate"
      # Reports of an app's own end-to-end suite (api's JUnit file,
      # web-client's Playwright report and traces).
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validate-report-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/test-results/
            ${{ matrix.app }}/e2e/playwright-report/
            ${{ matrix.app }}/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  openapi-breaking:
    name: openapi-breaking (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # One entry per app with an OpenAPI document; each must have an
        # <app>:openapi-breaking task.
        app:
          - api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD and its first parent. On a pull request HEAD is GitHub's merge
          # commit, whose first parent is the base branch; on a push to main it
          # is main before the push. Either way HEAD^ is what clients rely on.
          fetch-depth: 2
      - name: ./bin/mise run ${{ matrix.app }}:openapi-breaking -- HEAD^
        env:
          APP: ${{ matrix.app }}
        run: ./bin/mise run "$APP:openapi-breaking" -- "HEAD^"

  # The workflows themselves: actionlint, the permission rules the preview
  # comment relies on (.github/scripts/check-workflows.sh), and the tests of
  # the scripts the workflows run. Not an app, so not in the validate matrix.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run workflows
        run: ./bin/mise run workflows

  e2e:
    name: e2e
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run e2e
        run: ./bin/mise run e2e
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Deploys the pull request's build to its own Worker, fortymm-pr-<number>,
  # forwarding /api/* to the pull request's own api (API_ORIGIN, the address
  # preview-api deployed it to, so it waits for that job), and runs the
  # hosting checks against its address, the page reaching that api included
  # (they first wait until it serves this build: every pull request's first
  # run is a first deploy). The address goes in the job summary, and to
  # preview-comment as the job's output (empty when nothing was deployed);
  # this job never gets pull-requests: write itself. Only on a pull request
  # from a branch of this repository, not opened by Dependabot: elsewhere the
  # secrets are not given, so the job is skipped, and ci-passed accepts that.
  # When it runs, a failure fails ci-passed; when preview-api failed, it is
  # skipped, and ci-passed fails for preview-api.
  preview:
    name: preview (web-client)
    needs: preview-api
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      address: ${{ steps.address.outputs.address }}
    # One preview deploy at a time per pull request; a newer push replaces one
    # still waiting. preview-cleanup.yml shares the group.
    concurrency:
      group: preview-web-client-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run web-client:preview -- fortymm-pr-${{ github.event.pull_request.number }} <the api preview's address>
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: fortymm-pr-${{ github.event.pull_request.number }}
          API_ORIGIN: ${{ needs.preview-api.outputs.address }}
        run: ./bin/mise run web-client:preview -- "$WORKER" "$API_ORIGIN"
      - name: Show the preview's address
        if: ${{ !cancelled() }}
        run: |
          if [ -s web-client/worker/.wrangler/address ]; then
            echo "Preview of this pull request: $(cat web-client/worker/.wrangler/address)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No preview was deployed." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Give the preview's address to the comment job
        id: address
        if: ${{ !cancelled() }}
        run: |
          if [ -s web-client/worker/.wrangler/address ]; then
            echo "address=$(head -n 1 web-client/worker/.wrangler/address)" >>"$GITHUB_OUTPUT"
          fi
      - name: Upload the hosting checks' report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Deploys the pull request's api to its own Cloud Run service,
  # fortymm-api-pr-<number>, with its own database pr_<number> on the shared
  # preview instance, then runs api's end-to-end suite (api/e2e/) against its
  # address. A redeploy keeps the database. The address goes in the job
  # summary, and to preview-comment as the job's output. Same conditions as the web client's preview, above, and ci-passed
  # treats the two alike. It signs in to Google Cloud through Workload
  # Identity Federation: this job's OIDC token (id-token: write, given to this
  # job alone) becomes api-preview-deployer, which only GitHub Actions in this
  # repository can become; no key is stored anywhere, so nothing needs a
  # secret. The names come from api/hosting/hosting.env.
  preview-api:
    name: preview (api)
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      address: ${{ steps.address.outputs.address }}
    # One preview deploy at a time per pull request; a newer push replaces one
    # still waiting. preview-cleanup.yml's api job shares the group.
    concurrency:
      group: preview-api-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the hosting's names (api/hosting/hosting.env)
        id: hosting
        run: grep -E '^(WORKLOAD_IDENTITY_PROVIDER|DEPLOYER)=' api/hosting/hosting.env >>"$GITHUB_OUTPUT"
      # Writes a credential file (no key: it trades this job's OIDC token for
      # the deployer's) and names it in CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE,
      # which api:preview mounts into the api-hosting container.
      - name: Sign in to Google Cloud as the deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.hosting.outputs.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.hosting.outputs.DEPLOYER }}
      - name: ./bin/mise run api:preview -- fortymm-api-pr-${{ github.event.pull_request.number }}
        env:
          SERVICE: fortymm-api-pr-${{ github.event.pull_request.number }}
        run: ./bin/mise run api:preview -- "$SERVICE"
      - name: Show the preview's address
        if: ${{ !cancelled() }}
        run: |
          if [ -s api/hosting/.preview/address ]; then
            echo "Preview of this pull request's api: $(cat api/hosting/.preview/address)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No api preview was deployed." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Give the preview's address to the comment job
        id: address
        if: ${{ !cancelled() }}
        run: |
          if [ -s api/hosting/.preview/address ]; then
            echo "address=$(head -n 1 api/hosting/.preview/address)" >>"$GITHUB_OUTPUT"
          fi
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-api-report
          path: api/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Puts the two previews' addresses on the pull request: one comment, found by
  # a hidden marker and updated on every push, or created on the first
  # (.github/scripts/preview-comment.sh). The previews pass their addresses as
  # job outputs; one that deployed nothing reads "no preview was deployed".
  # The permissions are split so that no job holds both a way to deploy and a
  # way to write on the pull request: this is the only job with
  # pull-requests: write, and it has no secrets, no id-token and no checkout of
  # the pull request's code. It checks out the base commit's
  # .github/scripts only, so the script that runs with the token is one already
  # merged (a pull request that changes it sees the change after merge; where
  # the base has no script yet, the job leaves a notice and succeeds). It runs
  # under the previews' condition, even when one failed, and never where they
  # are skipped. It is no merge gate: ci-passed doesn't need it, so its failure
  # or absence doesn't block a merge. .github/scripts/check-workflows.sh
  # (./bin/mise run workflows) fails if any of this stops being true.
  preview-comment:
    name: preview comment
    needs: [preview, preview-api]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    # The newest run's addresses win.
    concurrency:
      group: preview-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Comment the previews' addresses on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WEB_CLIENT_ADDRESS: ${{ needs.preview.outputs.address }}
          API_ADDRESS: ${{ needs.preview-api.outputs.address }}
        # The base commit predates the script only on the pull request that
        # adds it: there, say so and stop, without failing.
        run: |
          if [ ! -f .github/scripts/preview-comment.sh ]; then
            echo "::notice::The base commit has no .github/scripts/preview-comment.sh yet, so no comment; the next pull request gets one."
            exit 0
          fi
          bash .github/scripts/preview-comment.sh

  ci-passed:
    name: ci-passed
    # Never preview-comment: it is no merge gate (check-workflows.sh fails if
    # a job needs it).
    needs: [validate, openapi-breaking, workflows, e2e, preview, preview-api]
    # Run even when a stage failed or was skipped, so this check always reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every stage to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The previews' condition, above (the same for both): where it holds,
          # both previews must have succeeded; elsewhere (a fork, Dependabot, a
          # push to main) they are skipped, and that's fine.
          PREVIEW_EXPECTED: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          echo "previews required: $PREVIEW_EXPECTED"
          jq -e --argjson expected "$PREVIEW_EXPECTED" 'all(to_entries[];
            .value.result == "success" or
            ((.key == "preview" or .key == "preview-api") and .value.result == "skipped" and ($expected | not)))' <<<"$NEEDS" >/dev/null

  # Deploys web-client to its production Worker on Cloudflare (workers.dev):
  # on a push to main only, once ci-passed has succeeded. Never on a pull
  # request, and not a check ci-passed waits for. It runs no checks against
  # the production address: the pull request's preview was checked. If the
  # secrets are missing, web-client:deploy says so and fails.
  deploy:
    name: deploy (web-client)
    needs: ci-passed
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time, in push order; a newer push waiting here
    # replaces an older one that hasn't started.
    concurrency:
      group: deploy-web-client
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./bin/mise run web-client:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./bin/mise run web-client:deploy
