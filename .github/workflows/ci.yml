name: CI

on: push

permissions:
  contents: read
  pull-requests: write
  # Lets the deploy steps record GitHub deployments.
  deployments: write
  # Lets google-github-actions/auth exchange the job's OIDC token for Google
  # credentials (Workload Identity Federation).
  id-token: write

# One run at a time per branch, so deploys land in push order.
concurrency:
  group: ci-${{ github.ref }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      # Set by api/deploy/bootstrap-gcp.sh's instructions; until then the API
      # isn't deployed.
      GCP_CONFIGURED: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5
      - run: ./bin/mise run ci
        env:
          CI: "true"

      # Records the deploys below as a GitHub deployment, so they show in the
      # repo's and the PR's Deployments panel with a link to the site: main
      # deploys to the production environment, other branches to a transient
      # "Preview (<branch>)" environment each.
      - name: Start the GitHub deployment
        id: start-deployment
        uses: actions/github-script@v8
        with:
          script: |
            const production = context.ref === 'refs/heads/main'
            const branch = context.ref.replace(/^refs\/heads\//, '')
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: production ? 'production' : `Preview (${branch})`,
              production_environment: production,
              transient_environment: !production,
              auto_merge: false,
              // This run is the check that matters; don't wait on the commit's statuses.
              required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', deployment.id)

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_CONFIGURED == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ env.GCP_CONFIGURED == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      # The API and Worker deploys below both use this version of the Worker
      # secret, so a version added mid-run can't make them disagree.
      - name: Pin the Worker secret version
        if: ${{ env.GCP_CONFIGURED == 'true' }}
        run: |
          version=$(gcloud secrets versions list api-worker-secret --project "${GCP_PROJECT:-fortymm}" \
            --filter=state=ENABLED --sort-by=~createTime --limit=1 --format='value(name.basename())')
          if [ -z "$version" ]; then
            echo "::error::api-worker-secret has no enabled version. See api/deploy/README.md."
            exit 1
          fi
          echo "WORKER_SECRET_VERSION=$version" >> "$GITHUB_ENV"

      - name: Skip the API deploy
        if: ${{ env.GCP_CONFIGURED != 'true' }}
        run: echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT aren't set, so the API isn't deployed and the Worker answers /api/* with a 503. See api/deploy/README.md."

      # The API goes first, so the Worker never points at a missing route. Its
      # URL, the deploy's last line of output, becomes the Worker's API_ORIGIN.
      - name: Deploy the API to Cloud Run
        if: ${{ env.GCP_CONFIGURED == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          set -o pipefail
          url=$(./bin/mise run api:deploy | tail -n 1)
          echo "API_ORIGIN=$url" >> "$GITHUB_ENV"
          echo "API: $url"

      # Every other branch gets a tagged Cloud Run revision with no traffic,
      # which its Cloudflare Preview below points at.
      - name: Deploy a Cloud Run Preview revision
        if: ${{ env.GCP_CONFIGURED == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          set -o pipefail
          url=$(./bin/mise run api:preview | tail -n 1)
          echo "API_ORIGIN=$url" >> "$GITHUB_ENV"
          echo "API: $url"

      # The *.run.app URL is public, so only the Worker secret keeps clients
      # from going around the Worker. --max-time allows for a cold start.
      - name: Check the API rejects direct requests
        if: ${{ env.GCP_CONFIGURED == 'true' }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$API_ORIGIN/v1/ping" || true)
          if [ "$status" != 403 ]; then
            echo "::error::$API_ORIGIN/v1/ping answered $status without the Worker secret, not 403."
            exit 1
          fi

      # Ships the web-client/dist that `ci` just built and tested. The Worker
      # secret stays in this step's shell, not in GITHUB_ENV.
      - name: Deploy to Cloudflare
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$GCP_CONFIGURED" = true ]; then
            WORKER_SECRET=$(gcloud secrets versions access "$WORKER_SECRET_VERSION" \
              --secret api-worker-secret --project "${GCP_PROJECT:-fortymm}")
            echo "::add-mask::$WORKER_SECRET"
            export WORKER_SECRET
          fi
          ./bin/mise run web-client:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Checks production once it's live. It can't stop a broken deploy, only
      # flag it. Without the API deploy /api/* answers 503, so it's skipped.
      - name: Check production
        if: ${{ env.GCP_CONFIGURED == 'true' && github.ref == 'refs/heads/main' }}
        run: ./bin/mise run web-client:e2e-deployed
        env:
          DEPLOY_URL: https://fortymm.com

      # Every other branch gets a Preview. Its URL, from wrangler's
      # "Preview URL: https://..." line, is the step's `url` output.
      - name: Deploy a Cloudflare Preview
        id: preview
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          if [ "$GCP_CONFIGURED" = true ]; then
            WORKER_SECRET=$(gcloud secrets versions access "$WORKER_SECRET_VERSION" \
              --secret api-worker-secret --project "${GCP_PROJECT:-fortymm}")
            echo "::add-mask::$WORKER_SECRET"
            export WORKER_SECRET
          fi
          set -o pipefail
          ./bin/mise run web-client:preview | tee "$RUNNER_TEMP/preview.log"
          url=$(sed -nE 's/^Preview URL: (https:[^[:space:]]+).*/\1/p' "$RUNNER_TEMP/preview.log" | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::Couldn't find the Preview URL in wrangler preview's output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Checks the branch's whole stack (Worker, assets and its API revision)
      # before it's merged.
      - name: Check the Cloudflare Preview
        if: ${{ env.GCP_CONFIGURED == 'true' && github.ref != 'refs/heads/main' }}
        run: ./bin/mise run web-client:e2e-deployed
        env:
          DEPLOY_URL: ${{ steps.preview.outputs.url }}

      # Marks the deployment succeeded (with its URL) or failed, counting the
      # post-deploy checks above. Runs whenever the deployment was started, so
      # a failed or cancelled deploy doesn't stay "in progress".
      - name: Finish the GitHub deployment
        if: ${{ always() && steps.start-deployment.outputs.id }}
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.start-deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ github.ref == 'refs/heads/main' && 'https://fortymm.com' || steps.preview.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success'
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: success ? 'success' : process.env.JOB_STATUS === 'cancelled' ? 'inactive' : 'failure',
              environment_url: success ? process.env.DEPLOYMENT_URL : '',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: process.env.API_ORIGIN ? `API: ${process.env.API_ORIGIN}`.slice(0, 140) : 'API not deployed',
              // A new deployment to the same environment supersedes this one.
              auto_inactive: true,
            })

      # Playwright writes its traces and HTML report into the bind-mounted
      # checkout, so they're here once the stack is gone.
      - name: Upload Playwright traces
        id: upload-traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            web-client/test-results/
            web-client/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Link the traces from the pull request
        if: ${{ !cancelled() && steps.upload-traces.outputs.artifact-url }}
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.upload-traces.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            })
            const marker = '<!-- playwright-traces -->'
            const body = [
              marker,
              `### Playwright traces (${process.env.JOB_STATUS})`,
              '',
              `Commit ${context.sha.slice(0, 7)}: [download the traces and HTML report](${process.env.ARTIFACT_URL}).`,
              '',
              'Unzip it, then open a test\'s `trace.zip` from `test-results/` with',
              '`npx playwright show-trace <path>` or by dropping it on https://trace.playwright.dev,',
              'or run `npx playwright show-report playwright-report`.',
            ].join('\n')
            for (const pull of pulls.filter((p) => p.state === 'open')) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number,
              })
              const existing = comments.find((c) => c.body?.startsWith(marker))
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body })
              }
            }
