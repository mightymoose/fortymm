name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Typecheck
        run: npm run typecheck
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_KEEP_STACK: '1'

      - name: Dump docker compose logs including retried failures
        if: ${{ !cancelled() }}
        run: docker compose -f docker-compose.dev.yml -f docker-compose.e2e.yml logs --no-color

      - name: Clean up e2e stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.dev.yml -f docker-compose.e2e.yml down -v

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
