name: openapi-schema

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/**'
      - 'web-client/package.json'
      - 'web-client/package-lock.json'
      - 'web-client/.npmrc'
      - 'web-client/src/api/**'
      - 'mise.toml'
      - '.github/workflows/openapi-schema.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: pip install -e '.[dev]'
        working-directory: api

      - run: npm ci
        working-directory: web-client

      - name: Regenerate OpenAPI types
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UV_PID=$!
          trap 'kill $UV_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/openapi.json -o /dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! curl -fs http://127.0.0.1:8000/openapi.json -o /dev/null; then
            echo "API failed to start" >&2
            cat /tmp/uvicorn.log >&2
            exit 1
          fi

          cd ../web-client
          API_URL=http://127.0.0.1:8000 npm run gen:api
        working-directory: api

      - name: Verify committed schema is up to date
        run: |
          if ! git diff --exit-code web-client/src/api/schema.d.ts; then
            echo "::error::web-client/src/api/schema.d.ts is out of date. Run 'mise run regen-api-types' locally and commit the result."
            exit 1
          fi
