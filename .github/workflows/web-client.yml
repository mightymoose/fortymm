name: web-client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client.yml'

defaults:
  run:
    working-directory: web-client

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:run
