name: web-client

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web-client

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:run
