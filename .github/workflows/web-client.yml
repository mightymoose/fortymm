name: web-client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client.yml'

defaults:
  run:
    working-directory: web-client

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:run

      - name: Install Playwright browser
        env:
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: '1'
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The ubuntu-latest runner (Noble) ships needrestart, whose apt
          # hook prompts interactively after package installs and hangs CI.
          # Force it into automatic mode globally so the sudo apt-get call
          # that --with-deps performs can't get stuck waiting for input.
          if [ -f /etc/needrestart/needrestart.conf ]; then
            sudo sed -i "s/^#\\?\\\$nrconf{restart} = .*/\$nrconf{restart} = 'a';/" /etc/needrestart/needrestart.conf
          fi
          npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-client/playwright-report
          retention-days: 7
