[project]
name = "api"
version = "0.1.0"
description = "fortymm's HTTP API"
requires-python = ">=3.15"
dependencies = [
  "asyncpg==0.32.0",
  "fastapi==0.162.3",
  "pydantic-settings==2.16.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "anyio==4.16.0",
  "asyncpg-stubs==0.32.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
