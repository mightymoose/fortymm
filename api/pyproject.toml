[project]
name = "fortymm-api"
version = "0.1.0"
description = "FortyMM API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ortools>=9.12",
    "redis>=5.0",
    "rq>=1.16,<3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "coolname>=2.2",
    "jsonschema>=4.21",
    "pydantic[email]>=2.0",
    "httpx>=0.27.0",
    "fastapi-limiter>=0.1.6,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    "fakeredis[lua]>=2.20",
    "testcontainers[postgres]>=4.8",
    "mypy>=1.13",
    "types-jsonschema>=4.21",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI relies on `Depends(...)` / `Query(...)` as argument defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true

# ortools ships incomplete inline types (it has a py.typed marker) — CpModel's
# methods (NewIntVar, Add, …) are added dynamically, so mypy reports false
# attr-defined errors. Skip following its imports so it's treated as untyped.
[[tool.mypy.overrides]]
module = "ortools.*"
follow_imports = "skip"
