# Development-only Compose stack. Driven by the mise tasks in mise.toml,
# which set COMPOSE_FILE and a per-checkout COMPOSE_PROJECT_NAME.
services:
  web-client:
    build:
      context: ./dev
      dockerfile: web-client.Dockerfile
    volumes:
      - ./web-client:/app
      - web-client-node-modules:/app/node_modules
    ports:
      # Host port chosen by Docker, so several checkouts can run at once.
      - "127.0.0.1::5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 180s
      start_interval: 1s

volumes:
  web-client-node-modules:
