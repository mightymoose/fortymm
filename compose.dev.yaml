# Development-only Compose stack. Driven by the mise tasks in mise.toml,
# which set COMPOSE_FILE, a per-checkout COMPOSE_PROJECT_NAME, and DEV_UID and
# DEV_GID (the host user).
#
# One service per app. The service is named after the app's directory, and its
# dev image lives in dev/<app>/. A service an app needs to run, such as its
# database, is <app>-<role> (api-db), with its image in dev/<app>-<role>/.
#
# Services that exist only for end-to-end tests are in the `e2e` profile, so
# `up` never starts them:
#   <app>-e2e      runs the app's own end-to-end suite, from <app>/e2e/ (api-e2e,
#                  web-client-e2e)
#   e2e            runs the cross-app suite in e2e/ (how the apps are served or
#                  connected)
#   <app>-<role>   anything else a suite needs, e.g. api-release (api's
#                  production image), web-client-preview (serves a
#                  web-client build to its own suite), web-client-worker
#                  (web-client's production hosting in the local Workers
#                  runtime; web-client-worker-<api> is the same Worker given
#                  an api) or api-echo (a stand-in for the api that answers
#                  with what it received)
#
# Tools a task runs once, such as api-oasdiff, are in the `tools` profile.

# Containers that write to the checkout run as the host user, so files they
# create (web-client/dist, test reports) are writable by the host on
# Linux too, where a bind mount keeps the container's uid.
x-host-user: &host-user "${DEV_UID:-1000}:${DEV_GID:-1000}"

# How api reaches its database: the configuration the stack gives both the dev
# server (api) and the production image (api-release).
x-api-database-url: &api-database-url postgresql://api:api@api-db:5432/api

# Liveness for a Python image: something accepts connections on port 8000.
# Deliberately not GET /health, so a failing health check is the end-to-end
# suite's to report, not a reason the stack never starts.
x-api-listening: &api-listening
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=1)"]
  interval: 5s
  timeout: 2s
  retries: 5

services:
  web-client:
    build:
      context: ./dev/web-client
    user: *host-user
    volumes:
      - ./web-client:/app
      - web-client-node-modules:/app/node_modules
    ports:
      # Host port chosen by Docker, so several checkouts can run at once.
      - "127.0.0.1::5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 180s
      start_interval: 1s

  # FastAPI under uvicorn --reload. The first start installs the venv.
  api:
    build:
      context: ./dev/api
    user: *host-user
    environment:
      DATABASE_URL: *api-database-url
      # For api:test, which runs in this service's container.
      TEST_DATABASE_URL: postgresql://api:api@api-db:5432/api_test
    volumes:
      - ./api:/app
      - api-venv:/opt/venvs
    ports:
      - "127.0.0.1::8000"
    depends_on:
      api-db:
        condition: service_healthy
    healthcheck:
      <<: *api-listening
      start_period: 180s
      start_interval: 1s

  # api's PostgreSQL. Databases: api (the dev server) and api_test (api:test).
  api-db:
    build:
      context: ./dev/api-db
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    volumes:
      - api-db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      # Over TCP: during first-run initialization the server listens only on
      # its Unix socket, so this stays false until the real server is up.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "api", "--dbname", "api"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # ---- e2e ------------------------------------------------------------------

  # vite preview, serving a build for web-client's own browser suite
  # (web-client/e2e/): web-client/e2e/.site, which web-client:e2e fills from
  # the production build and the suite replaces to deploy another build. It
  # reads the files on every request. Not the hosting: that is
  # web-client-worker, in the cross-app suite.
  web-client-preview:
    profiles: [e2e]
    build:
      context: ./dev/web-client
    user: *host-user
    volumes:
      - ./web-client:/app
      - web-client-node-modules:/app/node_modules
    command: ["npx", "vite", "preview", "--host", "0.0.0.0", "--port", "4173", "--strictPort", "--outDir", "e2e/.site"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4173/"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # Playwright for web-client's own browser suite (web-client/e2e/, the
  # web-client:e2e task), with the cross-app suite's image. It shares
  # web-client-preview's network, so the app is at localhost: a secure
  # context, where service workers run, as they do on the https production
  # hosting.
  web-client-e2e:
    profiles: [e2e]
    build:
      context: ./dev/e2e
    user: *host-user
    init: true
    # Chromium runs out of shared memory in a container without this.
    ipc: host
    network_mode: "service:web-client-preview"
    environment:
      BASE_URL: http://localhost:4173
      CI: ${CI:-}
    volumes:
      - ./web-client/e2e:/app
      - web-client-e2e-node-modules:/app/node_modules
    depends_on:
      web-client-preview:
        condition: service_healthy

  # web-client's production hosting, the Worker in web-client/worker/, in the
  # local Workers runtime (wrangler dev): the same configuration Cloudflare
  # runs, serving the production build in web-client/dist (made by
  # web-client:build), and like the production Worker given no api (its
  # API_ORIGIN is empty), so /api/* is a 404. The cross-app suite's hosting
  # tests drive it (web-client:worker-up starts it alone). Its image also runs
  # Wrangler for web-client:deploy-check and web-client:deploy.
  web-client-worker: &web-client-worker
    profiles: [e2e]
    build:
      context: ./dev/web-client-worker
    user: *host-user
    volumes:
      - ./web-client:/app
      - web-client-worker-node-modules:/app/worker/node_modules
    ports:
      - "127.0.0.1::8787"
    # Liveness only: the runtime answers HTTP. Deliberately not "/ is the
    # app", so a broken rule is the suite's to report, not a reason the stack
    # never starts.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 120s
      start_interval: 1s

  # The same Worker, given an api, as a pull request's preview is given its
  # own (wrangler dev --var, as wrangler deploy --var): each forwards /api/*
  # to its api, with /api stripped. Only the cross-app suite starts them.
  # Each keeps its runtime's state in its own /tmp, so they don't share
  # web-client/worker/.wrangler.
  #
  # Given api-release, api's production image with its api-db: the health
  # journey and the api's own answers through the Worker.
  web-client-worker-api:
    <<: *web-client-worker
    command: &wrangler-dev-with-api ["sh", "-c", 'exec npx wrangler dev --ip 0.0.0.0 --port 8787 --show-interactive-dev-session=false --persist-to /tmp/wrangler-state --var "API_ORIGIN:$$API_ORIGIN"']
    environment:
      API_ORIGIN: http://api-release:8000
    depends_on:
      api-release:
        condition: service_healthy

  # Given api-echo, which answers with what it received: the proxy's rules,
  # byte for byte.
  web-client-worker-echo:
    <<: *web-client-worker
    command: *wrangler-dev-with-api
    environment:
      API_ORIGIN: http://api-echo:8080
    depends_on:
      api-echo:
        condition: service_healthy

  # Given an api that can't be reached: a port nothing listens on, on a host
  # that exists (api-echo's).
  web-client-worker-unreachable:
    <<: *web-client-worker
    command: *wrangler-dev-with-api
    environment:
      API_ORIGIN: http://api-echo:9
    depends_on:
      api-echo:
        condition: service_healthy

  # Stands in for the api where the suite must see what the Worker forwarded:
  # it answers every request with what it received (dev/api-echo/server.mjs).
  # Not the api: the api's own answers through the Worker are tested against
  # api-release.
  api-echo:
    profiles: [e2e]
    build:
      context: ./dev/api-echo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # api's production image (api/Dockerfile) with its real start command,
  # configured like the dev server and using the same api-db.
  api-release:
    profiles: [e2e]
    build:
      context: ./api
    environment:
      DATABASE_URL: *api-database-url
    depends_on:
      api-db:
        condition: service_healthy
    healthcheck:
      <<: *api-listening
      start_period: 30s
      start_interval: 1s

  # pytest, driving api-release over the stack's network: api's own suite
  # (api/e2e/), run with api's dev image and its venv, like api:test.
  api-e2e:
    profiles: [e2e]
    build:
      context: ./dev/api
    user: *host-user
    environment:
      BASE_URL: http://api-release:8000
    volumes:
      - ./api:/app
      - api-venv:/opt/venvs
    command: ["pytest", "e2e", "--junitxml=test-results/junit.xml"]
    depends_on:
      api-release:
        condition: service_healthy

  # ---- cross-app e2e (stage 2) ------------------------------------------------

  # Playwright for the cross-app suite in e2e/ (the `e2e` task, CI's stage 2):
  # what can fail only because of how the apps are served or connected. It
  # drives the Worker in the local Workers runtime given no api
  # (web-client-worker), the real one (web-client-worker-api, to api-release
  # and its api-db), the echo (web-client-worker-echo) and one it can't reach
  # (web-client-worker-unreachable); the e2e task stops them all. One address
  # per Playwright project (e2e/playwright.config.ts).
  # web-client:hosting-check runs it with --no-deps against another address.
  e2e:
    profiles: [e2e]
    build:
      context: ./dev/e2e
    user: *host-user
    init: true
    # Chromium runs out of shared memory in a container without this.
    ipc: host
    environment:
      WORKER_URL: http://web-client-worker:8787
      NO_API_WORKER_URL: http://web-client-worker:8787
      API_WORKER_URL: http://web-client-worker-api:8787
      ECHO_WORKER_URL: http://web-client-worker-echo:8787
      UNREACHABLE_WORKER_URL: http://web-client-worker-unreachable:8787
      CI: ${CI:-}
    volumes:
      - ./e2e:/app
      - e2e-node-modules:/app/node_modules
      # The build the hosting checks expect the address to serve.
      - ./web-client/dist:/build:ro
    depends_on:
      web-client-worker:
        condition: service_healthy
      web-client-worker-api:
        condition: service_healthy
      web-client-worker-echo:
        condition: service_healthy
      web-client-worker-unreachable:
        condition: service_healthy

  # ---- tools ----------------------------------------------------------------
  # Run by a task, never by `up`.

  # openapi-typescript (web-client:api-types, web-client:api-types-check):
  # generates web-client/src/api/schema.gen.ts from api/openapi.json. The one
  # place web-client reads a file of another app, and read-only.
  web-client-openapi:
    profiles: [tools]
    build:
      context: ./dev/web-client-openapi
    user: *host-user
    volumes:
      - ./web-client:/app
      - ./api/openapi.json:/contracts/api/openapi.json:ro

  # Renders web-client's install icons (web-client/public/icons/) from its
  # icon, public/favicon.svg, with Chromium (web-client:icons). Runs a script
  # of web-client's browser suite, with its image and dependencies.
  web-client-icons:
    profiles: [tools]
    build:
      context: ./dev/e2e
    user: *host-user
    init: true
    ipc: host
    volumes:
      - ./web-client/e2e:/app
      - web-client-e2e-node-modules:/app/node_modules
      - ./web-client/public:/public
    command: ["node", "scripts/render-icons.ts", "/public"]

  # The shared core library (Rust). It is a library, so it has nothing to
  # serve: every core:* task runs one command in this container and exits.
  # Cargo's downloads and all build output are in the core-cache volume.
  core:
    profiles: [tools]
    build:
      context: ./dev/core
    user: *host-user
    volumes:
      - ./core:/app
      - core-cache:/opt/core

  # gcloud, for api's hosting on Google Cloud (api:gcloud, api:hosting-setup,
  # api:hosting-check, api:deploy-check). The login stays in the
  # api-hosting-gcloud volume, never in the checkout; `teardown` removes it.
  # The host's Docker socket is there so the Docker CLI can push an image the
  # host built to Artifact Registry, with gcloud's credentials.
  api-hosting:
    profiles: [tools]
    build:
      context: ./dev/api-hosting
    volumes:
      - ./api/hosting:/hosting:ro
      - api-hosting-gcloud:/gcloud
      - /var/run/docker.sock:/var/run/docker.sock

  # oasdiff (api:breaking). The base document arrives on standard input.
  api-oasdiff:
    profiles: [tools]
    build:
      context: ./dev/api-oasdiff
    volumes:
      - ./api/openapi.json:/revision/openapi.json:ro

volumes:
  web-client-node-modules:
  api-venv:
  api-db-data:
  e2e-node-modules:
  web-client-e2e-node-modules:
  web-client-worker-node-modules:
  core-cache:
  api-hosting-gcloud:
