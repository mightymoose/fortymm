services:
  dev:
    build: .
    # Keep the container running under `docker compose up` (as `mise run ci` does);
    # `docker compose run` replaces this with its own command.
    command: ["sleep", "infinity"]
    init: true
    environment:
      # Lets mise call GitHub's API without its anonymous rate limit (CI sets it).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # Healthy once the entrypoint has installed the tools, so `up --wait` blocks
    # until commands can be exec'd into the container.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tools-installed"]
      start_period: 10m
      start_interval: 1s
    ports:
      # No host port: Docker picks a free one. `mise run web-client:dev` prints it.
      - "5173"
    volumes:
      - .:/app
      - mise:/mise
      # Keep node_modules in the container so native deps match its platform.
      - web-client-node-modules:/app/web-client/node_modules

  # The FastAPI app in api/. No published port: the web-client dev server
  # proxies /api/* to it (see web-client/vite.config.ts), so it's reached at
  # http://localhost:<web-client port>/api/v1/health.
  api:
    build: .
    init: true
    working_dir: /app/api
    # --root-path makes the docs at /api/docs load the schema through the proxy.
    environment:
      DATABASE_URL: postgresql://fortymm:fortymm@postgres:5432/fortymm
      # Sign-in goes to the mock provider in the `oidc` service, not to Auth0.
      AUTH0_DOMAIN: http://oidc:8080/default
      AUTH0_CLIENT_ID: fortymm-dev
      AUTH0_CLIENT_SECRET: fortymm-dev
      # The browser can't resolve `oidc`, so it reaches the mock's sign-in page
      # through the web-client dev server's /oidc proxy.
      AUTH0_AUTHORIZE_URL: /oidc/default/authorize
      # The mock has no Auth0 /v2/logout, so sign-out uses its OpenID Connect
      # end-session endpoint, which sends the browser on to /signed-out.
      AUTH0_LOGOUT_URL: /oidc/default/endsession
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - fortymm_api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --root-path=/api
      - --reload
    # dev installs the tools into the shared mise volume first, so the two
    # containers don't install them at the same time.
    depends_on:
      dev:
        condition: service_healthy
      postgres:
        condition: service_healthy
      oidc:
        condition: service_healthy
    # Healthy once /v1/health answers, so `up --wait` blocks until the API serves
    # and reaches the database.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/health"]
      start_period: 10m
      start_interval: 1s
    volumes:
      - .:/app
      - mise:/mise
      # Keep the virtualenv in the container so native deps match its platform.
      - api-venv:/app/api/.venv

  # The API's database. Its major version matches the Cloud SQL instance's
  # (see api/deploy/bootstrap-gcp.sh).
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fortymm
      POSTGRES_PASSWORD: fortymm
      POSTGRES_DB: fortymm
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fortymm", "-d", "fortymm"]
      start_period: 1m
      start_interval: 1s
    ports:
      # No host port: Docker picks a free one. `mise run list-ports` prints it.
      - "5432"
    volumes:
      # postgres:18 keeps its data in a version-specific directory under this.
      - postgres-data:/var/lib/postgresql

  # A mock OpenID Connect provider that stands in for Auth0 in dev and the
  # tests, because Auth0 doesn't accept a random dev port in a callback URL.
  # Its sign-in page, oidc/sign-in.html, has a button for each of a few
  # people, and signs in any `sub` with the claims typed into it, such as
  # {"email": "a@example.com", "email_verified": true}. The issuer is
  # http://oidc:8080/default. It needs 6.1.0 or later, which puts auth_time in
  # the ID token when the request has max_age, as sign-in checks.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.0
    environment:
      JSON_CONFIG: '{"interactiveLogin": true, "loginPagePath": "/oidc/sign-in.html"}'
    volumes:
      - ./oidc:/oidc:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:8080/default/.well-known/openid-configuration
      start_period: 1m
      start_interval: 1s

  # Runs the web-client's Playwright suite (`mise run web-client:e2e`). The
  # image ships the browsers and their system libraries; keep its tag in sync
  # with @playwright/test in web-client/package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    command: ["sleep", "infinity"]
    init: true
    # Share dev's network so its dev server is on localhost:5173 (Vite rejects
    # requests addressed to other hostnames, such as `dev`).
    network_mode: service:dev
    depends_on:
      - dev
    # Chromium can crash when /dev/shm is small; Playwright recommends this.
    ipc: host
    working_dir: /app/web-client
    environment:
      CI: ${CI:-}
    volumes:
      - .:/app
      - web-client-node-modules:/app/web-client/node_modules

volumes:
  mise:
  web-client-node-modules:
  api-venv:
  postgres-data:
