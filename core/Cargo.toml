[package]
name = "fortymm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "FortyMM shared core: record bytes, signatures and parcels"
publish = false

[dependencies]
# SHA-256 and ECDSA P-256 verification, compiled into every build. Test code
# also signs with p256's software keys; the library itself never signs.
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
serde_json = "1"

# The bindings for the two targets that exist today. `cargo test` and
# `cargo build` without -p act on the library alone; core:wasm and
# core:python build and check the bindings.
[workspace]
members = ["bindings/wasm", "bindings/python"]
default-members = ["."]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1

# The tests sign and hash thousands of times; unoptimised they are slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
