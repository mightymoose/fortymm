apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "fortymm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.api.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.api.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "fortymm.selector" (dict "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortymm.selector" (dict "component" "api") | nindent 8 }}
    spec:
      # Bounded pod shutdown. Paired with uvicorn's
      # --timeout-graceful-shutdown below: uvicorn gets 5s to drain, so the pod
      # exits well inside this window instead of being SIGKILLed.
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: {{ include "fortymm.apiImage" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          # Migrations + seeds run in the migrate Job, not here.
          #
          # --timeout-graceful-shutdown is required now that /v1/stream holds
          # long-lived SSE connections. On SIGTERM uvicorn stops accepting and
          # waits for open connections to close — and an SSE connection never
          # closes on its own. Without the flag it waits forever, k8s SIGKILLs
          # at the 30s default, and the lifespan shutdown never runs: every pod
          # replacement becomes a 30s hang plus a hard kill. Cutting streams on
          # shutdown is correct here — the events are self-healing invalidation
          # hints, so clients just reconnect onto a live replica.
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --timeout-graceful-shutdown
            - "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          envFrom:
            {{- include "fortymm.appEnvFrom" . | nindent 12 }}
          env:
            # Server-side geocoding key for venue addresses — see
            # docs/adr/20260725-a-venues-coordinates-are-geocoded-server-side-and-not-null.md.
            # Sourced from the .env-backed Secret (secrets.env), the same place
            # every other sensitive var comes from; only UAT/prod set it.
            # optional:true does NOT mean "fall back to the fake geocoder". It
            # used to: the provider was inferred from key presence, so a missing
            # key silently selected FakeGeocoder — which is exactly how UAT spent
            # weeks writing hash-derived coordinates as though they were real.
            # That inference is gone. `GEOCODER` now names the provider outright,
            # it defaults to `google`, and a `google` with no key RAISES at
            # Settings construction — the pod fails its probe rather than
            # degrading.
            #
            # So this ref is only safe to leave optional because
            # `config.GEOCODER` is pinned to `fake` in values.yaml (see the
            # comment on that value). Remove that pin and the missing key stops
            # being harmless and starts being a boot failure. When UAT gets a
            # real key (#1205), the key lands in .env, `GEOCODER` flips to
            # `google`, and `optional: true` should come off with it.
            #
            # Declared explicitly (not just via the bulk envFrom Secret) so the
            # wiring is visible and greppable in the rendered Deployment.
            - name: GOOGLE_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.env }}
                  key: GOOGLE_GEOCODING_API_KEY
                  optional: true
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: apns-key
              mountPath: {{ .Values.apnsKeyPath }}
              subPath: {{ .Values.apnsKeyFile }}
              readOnly: true
          # /v1/readyz depends on the DB being migrated and redis being
          # reachable, so it can be red for a while on first boot — keep the
          # readiness window generous. It returns a non-2xx status when
          # unhealthy (unlike /v1/health, a diagnostic endpoint that always
          # returns 200), so this actually gates traffic. Liveness is a plain
          # TCP check so a not-yet-migrated DB doesn't trigger a restart loop.
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: apns-key
          secret:
            secretName: {{ .Values.secrets.apns }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "fortymm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fortymm.selector" (dict "component" "api") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
