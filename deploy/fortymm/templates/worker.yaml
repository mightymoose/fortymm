apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "fortymm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fortymm.selector" (dict "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortymm.selector" (dict "component" "worker") | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: {{ include "fortymm.apiImage" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["rq", "worker", "--url", "{{ .Values.config.REDIS_URL }}", {{ range $i, $q := splitList " " .Values.worker.queues }}{{ if $i }}, {{ end }}{{ $q | quote }}{{ end }}]
          resources:
            requests:
              cpu: {{ .Values.worker.requests.cpu }}
              memory: {{ .Values.worker.requests.memory }}
            limits:
              cpu: {{ .Values.worker.cpu }}
              memory: {{ .Values.worker.memory }}
          env:
            # CP-SAT's search-worker count — kept equal to the CPU limit above
            # (single source of truth: .Values.worker.cpu) so the solver never
            # oversubscribes the container's cgroup quota. See #1115 and the
            # comment on SOLVE_NUM_WORKERS in api/app/schedule_solves.py.
            - name: SOLVE_NUM_WORKERS
              value: {{ .Values.worker.cpu | quote }}
          envFrom:
            {{- include "fortymm.appEnvFrom" . | nindent 12 }}
          volumeMounts:
            - name: apns-key
              mountPath: {{ .Values.apnsKeyPath }}
              subPath: {{ .Values.apnsKeyFile }}
              readOnly: true
      volumes:
        - name: apns-key
          secret:
            secretName: {{ .Values.secrets.apns }}
