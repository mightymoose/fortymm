apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "fortymm-uat.nginxConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fortymm-uat.selector" (dict "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortymm-uat.selector" (dict "component" "nginx") | nindent 8 }}
      annotations:
        # Roll the pod when the routing config changes.
        checksum/config: {{ include "fortymm-uat.nginxConf" . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "fortymm-uat.selector" (dict "component" "nginx") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.nginxNodePort }}
