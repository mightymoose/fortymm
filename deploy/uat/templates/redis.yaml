apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fortymm-uat.selector" (dict "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortymm-uat.selector" (dict "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          # requests==limits → Guaranteed QoS, so the kubelet/kernel evict the
          # burstable app pods before this data tier under memory pressure (#763).
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fortymm-uat.selector" (dict "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
