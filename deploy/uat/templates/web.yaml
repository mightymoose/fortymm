apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.web.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.web.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "fortymm-uat.selector" (dict "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortymm-uat.selector" (dict "component" "web") | nindent 8 }}
    spec:
      containers:
        - name: web-client
          image: {{ include "fortymm-uat.webImage" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
  labels:
    {{- include "fortymm-uat.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fortymm-uat.selector" (dict "component" "web") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
