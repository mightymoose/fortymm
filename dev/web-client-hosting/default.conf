server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: a path that is not a file gets index.html, and the
    # router decides what it shows. The real hosting must do the same;
    # e2e/tests/hosting.spec.ts checks it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
