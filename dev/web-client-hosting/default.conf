server {
    listen 80;
    root /usr/share/nginx/html;

    # The api, on the app's own origin: /api/v1/health goes to the api's
    # /v1/health (the trailing slash on proxy_pass strips /api). The real
    # hosting must do the same; e2e/tests/health.spec.ts checks it.
    location /api/ {
        proxy_pass http://api-release:8000/;
    }

    # The service worker that keeps the app on the device (web-client's
    # offline/). The real hosting must do the same, for these reasons:
    # - Served at /sw.js, at the root, so its scope is the whole app; never
    #   redirected, and never answered with index.html (a missing sw.js is a
    #   404).
    # - As JavaScript (application/javascript or text/javascript), or the
    #   browser refuses to register it.
    # - With Cache-Control: no-cache, and never kept by an edge cache, so every
    #   check the browser makes for a new version reaches this build's file. A
    #   stale sw.js leaves phones on the old version.
    # e2e/tests/hosting.spec.ts checks the header.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The web app manifest, for installing the app. The real hosting must
    # serve it at /manifest.webmanifest as application/manifest+json (nginx's
    # mime.types maps .webmanifest to it), and no-cache, so a changed name or
    # icon reaches installed apps.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: a path that is not a file gets index.html, and the
    # router decides what it shows. The real hosting must do the same;
    # e2e/tests/hosting.spec.ts checks it. Once the service worker is
    # installed it answers these paths itself, with the copy it kept.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
