# A stand-in, for one job only: the cross-app suite's api-wiring tests
# (e2e/tests/health.spec.ts) need the web client and the api on one origin,
# and the production hosting, the Worker in web-client/worker/, has no proxy
# to the api yet. The hosting's own rules (headers, 404s, the app's page for
# unknown paths) are the Worker's, in web-client/worker/src/index.ts, and the
# cross-app suite checks them against it. Delete this when the Worker's proxy
# lands.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The api, on the app's own origin: /api/v1/health goes to the api's
    # /v1/health (the trailing slash on proxy_pass strips /api). The Worker's
    # proxy must do the same.
    location /api/ {
        proxy_pass http://api-release:8000/;
    }

    # Enough of the app for those tests: the page loads at /health, and the
    # service worker installs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
