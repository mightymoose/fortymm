server {
    listen 80;
    root /usr/share/nginx/html;

    # The api, on the app's own origin: /api/v1/health goes to the api's
    # /v1/health (the trailing slash on proxy_pass strips /api). The real
    # hosting must do the same; e2e/tests/health.spec.ts checks it.
    location /api/ {
        proxy_pass http://api-release:8000/;
    }

    # Single-page app: a path that is not a file gets index.html, and the
    # router decides what it shows. The real hosting must do the same;
    # e2e/tests/hosting.spec.ts checks it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
