# Overrides docker-compose.dev.yml for end-to-end tests.
# The dev file publishes ports for local developer convenience; for e2e we
# only need nginx reachable from the host, on a port that won't collide with
# anything the developer is already running (including the dev nginx on 8080).
#
# The api/worker services also pin GEOCODER=fake here rather than inheriting
# dev's value. The suite depends on the FakeGeocoder's determinism —
# tournaments-near-me.spec.ts asserts exact venue coordinates — and CI must
# never make a network geocoding call, so the e2e stack states its own choice
# instead of following dev if dev ever gets a real Google key. See
# docs/adr/20260725-a-venues-coordinates-are-geocoded-server-side-and-not-null.md
# ("The geocoder is selected by explicit config, not inferred from key presence").
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      GEOCODER: fake
      # The whole e2e suite is one host from the api's point of view, so the
      # per-IP self-entry ceiling must never fire mid-suite (the #1552 lesson).
      TOURNAMENT_ENTRY_IP_PER_HOUR: "1000000"
  worker:
    environment:
      GEOCODER: fake
  web-client:
    ports: !reset []
  nginx:
    ports: !override
      - "${E2E_NGINX_PORT:-18080}:80"
