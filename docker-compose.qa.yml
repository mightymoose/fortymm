# QA stack — built artifacts, no dev server, isolated volumes.
#
# A prod-like stack (same shape as docker-compose.uat.yml) that runs
# alongside the dev and UAT stacks. Project name `fortymm-qa` keeps
# networks, containers, and volumes namespaced. Only `nginx` (8085 — UAT
# holds 8084) and `mailpit` (8087, the captured-email web UI) publish host
# ports. Everything else is reachable only on the internal docker network;
# use `docker exec` for ad-hoc psql/redis-cli access.
#
# Bring up:    docker compose -f docker-compose.qa.yml up -d --build
# Bring down:  docker compose -f docker-compose.qa.yml down
# Wipe data:   docker compose -f docker-compose.qa.yml down -v
#
# Unlike UAT (fronted by host Caddy at uat.fortymm.com), QA is local-only:
# hit it directly at http://127.0.0.1:8085.
#
# Many at once: every host-facing knob is parameterized so independent QA
# stacks can run side by side. Override per stack:
#   QA_ID           project-name suffix; unset → project fortymm-qa
#   QA_PORT         nginx host port AND the APP_BASE_URL email links point at
#   QA_MAILPIT_PORT Mailpit web-UI host port
# e.g.  QA_ID=pr604 QA_PORT=8090 QA_MAILPIT_PORT=8091 \
#         docker compose -f docker-compose.qa.yml up -d --build
# With no overrides the defaults below reproduce the original single stack
# (project fortymm-qa, nginx 8085, mailpit 8087). scripts/qa-up.sh picks a
# free port trio automatically.

name: fortymm-qa${QA_ID:+-${QA_ID}}

# api and worker run the same image and load the same secrets; only their
# environment/command/depends_on differ.
x-api-service: &api-service
  build:
    context: ./api
    dockerfile: Dockerfile.dev
  env_file:
    - .env

# Preview stacks must never send real email. .env points SMTP_* at the live
# Postmark account; these keys override it (compose `environment:` wins over
# `env_file:`) so the worker delivers to the in-network Mailpit on :1025 with
# no TLS and no auth. APP_BASE_URL is also overridden here: .env hardcodes
# uat.fortymm.com, but QA is reached at http://127.0.0.1:8085, so captured
# sign-in/confirmation links must point there to be clickable. Read captured
# mail at the Mailpit web UI on the host port published by `mailpit` below.
# See root CLAUDE.md "Preview-stack email (Mailpit)".
x-mailpit-smtp: &mailpit-smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USE_TLS: "false"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  APP_BASE_URL: http://127.0.0.1:${QA_PORT:-8085}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fortymm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fortymm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *api-service
    environment:
      <<: *mailpit-smtp
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fortymm
      REDIS_URL: redis://redis:6379/0
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same image as dev but no --reload and no source volume mount —
    # the image's COPY'd /app is what runs. Both seed scripts are
    # idempotent (seed_rbac.py: additive; seed_leagues.py: upserts the
    # default league), so chaining them after migrations is safe on
    # every boot.
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_rbac.py &&
             python scripts/seed_leagues.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    <<: *api-service
    environment:
      <<: *mailpit-smtp
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fortymm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: rq worker --url redis://redis:6379/0 solver email ratings

  # Catches every email the worker sends in this preview stack instead of
  # relaying it to Postmark. SMTP on :1025 (internal); web UI on :8025,
  # published to the host below (QA is local-only anyway).
  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "${QA_MAILPIT_PORT:-8087}:8025"  # Mailpit web UI — http://127.0.0.1:8087

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile.uat
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${QA_PORT:-8085}:80"
    # uat.conf only references internal service names (api:8000,
    # web-client:80), so it is host-port-agnostic and shared as-is.
    volumes:
      - ./nginx/uat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-client

volumes:
  postgres-data:
