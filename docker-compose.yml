name: fortymm

# Shared web-client settings. Each service below adds how it is reached.
x-web-client: &web-client
  build:
    context: .
    dockerfile: web-client/Dockerfile
    target: dev
  volumes:
    - ./web-client:/app/web-client
    # Keep the image's node_modules (Linux builds) instead of the host directory.
    - /app/web-client/node_modules
  # Lets `docker compose up --wait` (the dev task) know when Vite is serving.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5173/"]
    interval: 30s
    start_period: 60s
    start_interval: 1s

# Shared api settings. Each service below adds how it is reached.
x-api: &api
  build:
    context: .
    dockerfile: api/Dockerfile
    target: dev
  volumes:
    - ./api:/app/api
    # Keep the image's .venv (Linux builds) instead of the host directory.
    - /app/api/.venv
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/v1/health"]
    interval: 30s
    start_period: 60s
    start_interval: 1s

services:
  # Checks the product requirements in requirements/*.dfy with Dafny + Z3.
  # Run via ./bin/mise run requirements:check (see mise-tasks/requirements/).
  check-requirements:
    build:
      context: .
      dockerfile: requirements/Dockerfile
    # Dafny ships no linux/arm64 build; runs under Rosetta on Apple Silicon.
    platform: linux/amd64
    volumes:
      - ./requirements:/app/requirements
    profiles: ["tools"]

  # Vite + React + TypeScript app. Run via ./bin/mise run web-client:dev (see mise-tasks/web-client/).
  web-client:
    <<: *web-client
    # Vite proxies /api to the api service (see web-client/vite.config.ts).
    depends_on:
      - api
    # Container port only: Docker picks a free host port, so many dev servers can run at once.
    ports:
      - "5173"

  # FastAPI server. Run via ./bin/mise run api:dev (see mise-tasks/api/). The web client reaches
  # it as http://api:8000 on the compose network.
  api:
    <<: *api
    # Container port only: Docker picks a free host port.
    ports:
      - "8000"

  # The api for preview: no host ports, reached only by web-client-public's /api proxy.
  api-public:
    <<: *api
    profiles: ["public"]

  # Tailscale sidecar: puts the public dev server on the tailnet and on the internet via Funnel.
  # Run via ./bin/mise run preview. Setup steps are in the README.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: fortymm
    environment:
      # From .env (see .env.example). Only needed the first time; the node identity is then
      # kept in the tailscale-state volume.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Stays on the default network, so services sharing its network namespace
    # (web-client-public) can still reach other services, e.g. a future db, by name.
    restart: unless-stopped
    profiles: ["public"]

  # The dev server, reachable only through the tailscale sidecar: no host ports.
  # Funnel proxies https://fortymm.<tailnet>.ts.net to 127.0.0.1:5173 in the shared namespace.
  web-client-public:
    <<: *web-client
    network_mode: service:tailscale
    environment:
      - API_URL=http://api-public:8000
    depends_on:
      - tailscale
      - api-public
    profiles: ["public"]

  # nginx serving the design system reference in requirements/design-system/reference/.
  # Run via ./bin/mise run requirements:design-system:reference:serve (see mise-tasks/requirements/).
  design-system:
    build:
      context: .
      dockerfile: requirements/design-system/Dockerfile
    volumes:
      - ./requirements/design-system/reference:/srv/design-system:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      start_period: 30s
      start_interval: 1s
    # Container port only: Docker picks a free host port.
    ports:
      - "80"

  # Coming next:
  # db:   postgres

volumes:
  tailscale-state:
