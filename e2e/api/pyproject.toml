# api's end-to-end suite: drives the api-release service (the production image)
# over the stack's network. Run it with ./bin/mise run api:e2e.
[project]
name = "api-e2e"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = [
  "httpx==0.28.1",
  "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--junitxml=test-results/junit.xml"]
