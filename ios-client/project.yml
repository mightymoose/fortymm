name: FortyMM
options:
  bundleIdPrefix: com.fortymm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  # Apple's OpenAPI generator writes the API client from api/openapi.json at
  # build time, so a schema change breaks this build.
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    exactVersion: 1.14.3
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.13.3
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.4.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FortyMM:
    type: application
    platform: iOS
    sources:
      - FortyMM
      # The design system's own file, so the app can't drift from it.
      - path: ../references/design-system/fonts/BebasNeue-Regular.ttf
        group: FortyMM/Fonts
      - path: ../references/design-system/fonts/JetBrainsMono-VariableFont_wght.ttf
        group: FortyMM/Fonts
      # The API's committed schema. The generator finds it, and its config,
      # only among the target's files, so both also land in the bundle.
      - path: ../api/openapi.json
        group: FortyMM/API
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    info:
      path: FortyMM/Info.plist
      properties:
        CFBundleDisplayName: FortyMM
        # XcodeGen writes 1.0 and 1 otherwise, and TestFlight refuses a
        # build number it already has.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [BebasNeue-Regular.ttf, JetBrainsMono-VariableFont_wght.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        # The dev stack serves the API over http on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app's only encryption is the system's HTTPS, which is exempt. So
        # TestFlight asks no export compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fortymm.ios-client
        # iPhone only for now. An App Store update can't drop iPad support
        # once a release has it, so add "2" only with an iPad layout.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FortyMMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FortyMMTests
      # The signed result vectors every client checks, from where the API's
      # generator writes them.
      - path: ../api/signed-results/vectors.json
        group: FortyMMTests
        buildPhase: resources
    dependencies:
      - target: FortyMM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FortyMMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FortyMMUITests]
    dependencies:
      - target: FortyMM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FortyMM
schemes:
  FortyMM:
    build:
      targets:
        FortyMM: all
    test:
      targets:
        - FortyMMTests
        - FortyMMUITests
