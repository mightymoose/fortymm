[tools]
node = "26.1.0"
python = "3.13"
# UAT deploys to a local k3d Kubernetes cluster via Helm (scripts/redeploy-uat.sh).
helm = "latest"
k3d = "latest"

[tasks.redeploy-uat]
description = "Rebuild images and helm-deploy the fortymm-uat k3d cluster; smoke-check https://uat.fortymm.com"
run = "./scripts/redeploy-uat.sh"

[tasks.release-beta]
description = "Release to test channels: redeploy UAT, then build + upload the iOS app to TestFlight"
run = """
#!/usr/bin/env bash
set -euo pipefail

# UAT first: it's fast and local, so a failure here aborts before the long
# iOS build/upload. iOS second: signs and uploads to TestFlight.
echo "==> [1/2] Releasing UAT"
mise run redeploy-uat

echo
echo "==> [2/2] Releasing iOS to TestFlight"
mise run ios-testflight

echo
echo "==> Released: UAT (https://uat.fortymm.com) + iOS TestFlight"
"""

[tasks.ios-testflight]
description = "Build a signed iOS release and upload it to TestFlight (fastlane beta)"
dir = "ios"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Ruby 3.4.9 is pinned in ios/mise.toml; `mise exec` activates it for the
# bundle/fastlane invocations regardless of where this task is launched from.

# Load App Store Connect creds from the gitignored dotenv if the caller
# hasn't already exported them (CI sets them as secrets in the environment).
if [ -f fastlane/.env ]; then
  set -a
  # shellcheck disable=SC1091
  . fastlane/.env
  set +a
fi

: "${ASC_KEY_ID:?set ASC_KEY_ID (App Store Connect API key id)}"
: "${ASC_ISSUER_ID:?set ASC_ISSUER_ID (App Store Connect issuer id)}"
: "${ASC_KEY_PATH:?set ASC_KEY_PATH (path to the .p8 API key)}"

mise exec -- bundle install --quiet
mise exec -- bundle exec fastlane beta
"""

[tasks.regen-api-types]
description = "Start API (if not running) and regenerate OpenAPI types for web-client"
run = """
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(pwd)"
API_HOST="${API_HOST:-127.0.0.1}"
API_PORT="${API_PORT:-8000}"
API_URL="http://${API_HOST}:${API_PORT}"

probe() { curl -fs -o /dev/null --max-time 1 "$API_URL/openapi.json"; }

API_PID=""
cleanup() { [ -n "$API_PID" ] && kill "$API_PID" 2>/dev/null || true; }
trap cleanup EXIT

if probe; then
  echo "Using API already running at $API_URL"
else
  echo "Starting API server at $API_URL..."
  cd "$ROOT/api"
  if [ ! -x ".venv/bin/uvicorn" ]; then
    python -m venv .venv
    .venv/bin/pip install -q -e '.[dev]'
  fi
  .venv/bin/uvicorn app.main:app --host "$API_HOST" --port "$API_PORT" \\
    >/tmp/fortymm-api.log 2>&1 &
  API_PID=$!
  cd "$ROOT"

  for _ in $(seq 1 60); do
    if probe; then break; fi
    sleep 0.5
  done
  if ! probe; then
    echo "API failed to start. Last log:" >&2
    tail -n 40 /tmp/fortymm-api.log >&2 || true
    exit 1
  fi
fi

cd "$ROOT/web-client"
[ -d node_modules ] || npm ci
API_URL="$API_URL" npm run gen:api
echo "Wrote web-client/src/api/schema.d.ts"
"""
