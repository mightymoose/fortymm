[tools]
node = "26.1.0"
python = "3.13"
# UAT deploys to a local k3d Kubernetes cluster via Helm (scripts/redeploy-uat.sh).
helm = "latest"
k3d = "latest"

[tasks.redeploy-uat]
description = "Helm-deploy this commit's published GHCR images (pinned by digest) to the fortymm-uat k3d cluster; smoke-check https://uat.fortymm.com"
run = "./scripts/redeploy-uat.sh"

[tasks.qa-down]
description = "Tear down a QA stack and reclaim its volumes + built images (--all for every stack, --prune-cache for the buildx cache)"
run = "./scripts/qa-down.sh"

[tasks.release-beta]
description = "Release to test channels: redeploy UAT, then build + upload the iOS app to TestFlight"
run = """
#!/usr/bin/env bash
set -euo pipefail

# UAT first: it's fast and local, so a failure here aborts before the long
# iOS build/upload. iOS second: signs and uploads to TestFlight.
echo "==> [1/2] Releasing UAT"
mise run redeploy-uat

echo
echo "==> [2/2] Releasing iOS to TestFlight"
mise run ios-testflight

echo
echo "==> Released: UAT (https://uat.fortymm.com) + iOS TestFlight"
"""

[tasks.ios-testflight]
description = "Build a signed iOS release and upload it to TestFlight (fastlane beta)"
dir = "ios"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Ruby 3.4.9 is pinned in ios/mise.toml; `mise exec` activates it for the
# bundle/fastlane invocations regardless of where this task is launched from.

# Load App Store Connect creds from the gitignored dotenv if the caller
# hasn't already exported them (CI sets them as secrets in the environment).
if [ -f fastlane/.env ]; then
  set -a
  # shellcheck disable=SC1091
  . fastlane/.env
  set +a
fi

: "${ASC_KEY_ID:?set ASC_KEY_ID (App Store Connect API key id)}"
: "${ASC_ISSUER_ID:?set ASC_ISSUER_ID (App Store Connect issuer id)}"
: "${ASC_KEY_PATH:?set ASC_KEY_PATH (path to the .p8 API key)}"

mise exec -- bundle install --quiet
mise exec -- bundle exec fastlane beta
"""

[tasks.regen-api-types]
description = "Start API (if not running) and regenerate OpenAPI types for web-client"
run = """
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(pwd)"
# Assign-then-eval, piped through `tail -n1` (mirrors qa-up.sh's own
# documented convention for this exact hazard): `eval "$(cmd)"` directly
# would (a) hide a failure from `set -e` -- a failing command substituted
# as another command's argument, rather than a bare assignment, doesn't
# trip errexit, since eval of an empty string still exits 0 -- and (b) eval
# whatever incidental stdout a future edit to the script emits before its
# final line, not just the intended KEY=value handoff.
API_STATUS="$("$ROOT/scripts/ensure-api-up.sh" | tail -n1)"
eval "$API_STATUS"
trap '[ -n "$API_STARTED_PID" ] && kill "$API_STARTED_PID" 2>/dev/null || true' EXIT

cd "$ROOT/web-client"
[ -d node_modules ] || npm ci
API_URL="$API_URL" npm run gen:api
echo "Wrote web-client/src/api/schema.d.ts"
"""

[tasks.regen-ios-api-types]
description = "Start API (if not running) and regenerate OpenAPI types for the iOS app"
run = """
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(pwd)"
API_STATUS="$("$ROOT/scripts/ensure-api-up.sh" | tail -n1)"
eval "$API_STATUS"
# Registered before `mktemp` (not after) so a started-but-not-yet-cleaned-up
# server can't leak if `mktemp` itself fails.
TMP_SPEC=""
trap 'rm -f "$TMP_SPEC"; [ -n "$API_STARTED_PID" ] && kill "$API_STARTED_PID" 2>/dev/null || true' EXIT

TMP_SPEC="$(mktemp)"
curl -fs "$API_URL/openapi.json" -o "$TMP_SPEC"

# swift-openapi-generator silently drops any `Optional[T]` field encoded the
# way Pydantic/FastAPI encode it in OpenAPI 3.1 (`anyOf: [T, {type: null}]`)
# -- it only understands the older `nullable: true` sibling form. Rewrite
# before generating, or fields like PlayerRead.rating vanish with just a
# warning, no build error. Reads the whole document into memory before
# writing, so in-place (same path in and out) is safe.
python3 "$ROOT/ios/openapi/fix_openapi_nullable.py" "$TMP_SPEC" "$TMP_SPEC"

cd "$ROOT/ios/Tools/OpenAPIGeneratorCLI"
swift run swift-openapi-generator generate "$TMP_SPEC" \\
  --config "$ROOT/ios/openapi/openapi-generator-config.yaml" \\
  --output-directory "$ROOT/ios/Fortymm/Generated"
echo "Wrote ios/Fortymm/Generated/Types.swift"
"""
