# Host config: tasks that drive the Docker Compose stack.
# Tool versions used inside the dev container live in mise.container.toml.

[tasks.up]
description = "Start the local dev stack (currently just the web-client dev server)"
depends = ["web-client:dev"]

[tasks.ci]
description = "Bring up the stack in the background, run every CI check inside it, then tear it down"
run = """
docker compose up -d --build --wait
trap 'docker compose rm --force --stop >/dev/null 2>&1' EXIT INT TERM
./bin/mise run web-client:ci
./bin/mise run web-client:e2e
"""

[tasks."web-client:ci"]
description = "Install, lint, build and test the web-client inside the running dev container (start it with `mise run ci`)"
# exec bypasses the image entrypoint, so call it to get the container's tools on PATH.
run = "docker compose exec -T -w /app/web-client dev /app/bin/docker-entrypoint sh -c 'npm ci && npm run lint && npm run build && npm test'"

[tasks."web-client:e2e"]
description = "Start the dev server in the running dev container and run the Playwright suite against it (start the stack with `mise run ci`)"
# Expects node_modules installed (web-client:ci runs `npm ci` first).
# Traces and the HTML report land in web-client/test-results and
# web-client/playwright-report on the host.
run = """
docker compose exec -d -T -w /app/web-client dev /app/bin/docker-entrypoint npm run dev
docker compose exec -T playwright sh -c '
  for i in $(seq 60); do curl -sf -o /dev/null http://localhost:5173 && exit 0; sleep 1; done
  echo "dev server did not start on :5173" >&2; exit 1'
docker compose exec -T playwright npx playwright test
"""

[tasks."web-client:deploy"]
description = "Deploy web-client/dist to Cloudflare Workers (needs a build, e.g. from `mise run ci`, and CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)"
# Uses the node_modules volume `npm ci` filled; `run` works after `ci` has
# removed the stack's containers.
run = "docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -w /app/web-client dev npx wrangler deploy"

[tasks."web-client:preview"]
description = "Upload web-client/dist as a Cloudflare Workers Preview named after the current git branch (same needs as web-client:deploy)"
# Preview names become part of a hostname, so slug the branch name
# (claude/foo_bar -> claude-foo-bar).
run = """
name=$(git rev-parse --abbrev-ref HEAD | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-40 | sed -E 's/^-+|-+$//g')
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -w /app/web-client dev npx wrangler preview --name "$name"
"""

[tasks."web-client:test"]
description = "Run the web-client unit tests inside the dev container"
run = "docker compose run --rm -w /app/web-client dev sh -c 'npm install && npm test'"

[tasks."web-client:dev"]
description = "Start the web-client Vite dev server inside the dev container on a free host port"
run = """
name="fortymm-web-client-dev-$$"
docker compose run -d --rm --service-ports --name "$name" -l fortymm.task=web-client-dev \
  -w /app/web-client dev \
  sh -c 'npm install && npm run dev' >/dev/null
trap 'docker stop "$name" >/dev/null 2>&1' EXIT INT TERM
port=$(docker port "$name" 5173/tcp | head -n 1)
echo "web-client dev server: http://localhost:${port##*:}"
docker logs -f "$name"
"""

[tasks.list-ports]
description = "Print the published host ports of everything running from this checkout"
# {% raw %} keeps mise's Tera templating away from docker's Go template.
run = """
docker ps \
  --filter "label=com.docker.compose.project.working_dir=$PWD" \
  --format '{% raw %}{{if .Label "fortymm.task"}}{{.Label "fortymm.task"}}{{else}}{{.Label "com.docker.compose.service"}}{{end}} {{.ID}}{% endraw %}' |
while read -r name id; do
  # Each mapping looks like "5173/tcp -> 0.0.0.0:32768" (repeated for IPv6).
  docker port "$id" | while read -r mapping; do
    printf '%-20s %-10s localhost:%s\n' "$name" "${mapping%% *}" "${mapping##*:}"
  done | sort -u
done
"""
