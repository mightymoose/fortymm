# Every task runs inside the development Compose stack (compose.dev.yaml).
# Nothing but Docker runs on the host; run mise as ./bin/mise.
#
# Naming: stack-wide tasks have plain names and act on every service.
# App tasks are prefixed with the app's name (its directory and its Compose
# service), e.g. web-client:lint. To add an app, copy the web-client block.
#
# CI (.github/workflows/ci.yml) calls <app>:validate for each app (everything
# the app can prove by itself), then the stack-wide e2e task (the cross-app
# suite: how the apps are served or connected). Both run the same way on a
# laptop.

[env]
COMPOSE_FILE = "{{ config_root }}/compose.dev.yaml"
# One Compose project per checkout, so git worktrees never share containers,
# networks or volumes: directory name plus a hash of the full path.
COMPOSE_PROJECT_NAME = "fortymm-{{ config_root | basename | kebabcase }}-{{ config_root | hash(len=8) }}"
# `docker compose ps` format that prints each published port as a URL.
# The host user. Containers that write to the checkout run as this user, so the
# files they create stay writable on Linux hosts (CI runners included).
DEV_UID = "{{ exec(command='id -u') }}"
DEV_GID = "{{ exec(command='id -g') }}"
# PostgreSQL's port (5432) prints as a postgresql:// URL, every other as http://.
DEV_PORTS_FORMAT = "{% raw %}{{range .Publishers}}{{if .PublishedPort}}{{$.Service}}  {{.TargetPort}}/{{.Protocol}} -> {{if eq .TargetPort 5432}}postgresql{{else}}http{{end}}://{{.URL}}:{{.PublishedPort}}{{println}}{{end}}{{end}}{% endraw %}"

# ---- Stack-wide -------------------------------------------------------------

[tasks.up]
description = "Start every app in the stack and print their URLs"
# web-client loads the core's browser build, which core:wasm makes.
depends = ["core:wasm"]
run = "docker compose up --detach --build --wait"
depends_post = ["ports"]

# `--profile "*"` includes the e2e-only services, so nothing is left behind.
[tasks.down]
description = "Stop the stack; keeps built images and dependency volumes"
run = 'docker compose --profile "*" down --remove-orphans'

[tasks.teardown]
description = "Remove everything: containers, networks, volumes and built images"
run = 'docker compose --profile "*" down --volumes --rmi local --remove-orphans'

[tasks.ports]
description = "Print every published port of the stack as a URL"
quiet = true
run = 'docker compose ps --format "$DEV_PORTS_FORMAT" | grep -v "^$"'

[tasks.logs]
description = "Follow the logs of every app in the stack"
run = "docker compose logs --follow --tail 100"

[tasks.validate]
description = "Validate every app (each app's <app>:validate) and the GitHub workflows (workflows)"
depends = ["web-client:validate", "api:validate", "core:validate", "workflows"]

# The GitHub workflows in .github/ (CI's workflows job): actionlint; the rules
# in .github/scripts/check-workflows.sh (only the preview comment job may write
# on a pull request, and it has no secrets, no id-token and no checkout of the
# pull request's code; it runs only where the previews do; nothing waits for
# it), and that check's own tests; the comment script's tests, against a
# stand-in for gh. In the workflows tool container, .github read-only.
[tasks.workflows]
description = "Check the GitHub workflows: actionlint, the permission rules, and the tests of the scripts they run"
run = """
docker compose --profile tools build workflows
docker compose --profile tools run --rm -T workflows sh -c '
  set -e
  actionlint -no-color .github/workflows/*.yml
  bash .github/scripts/check-workflows.sh
  bash .github/scripts/tests/check-workflows.sh
  bash .github/scripts/tests/preview-comment.sh
'
"""

# The cross-app suite in e2e/ (CI's stage 2): what can fail only because of how
# the apps are served or connected. Everything an app can prove by itself runs
# in its <app>:validate instead. Typechecks the suite, builds web-client,
# serves the build from web-client-worker (its production hosting, the Worker,
# in the local Workers runtime) and from web-client-hosting (an nginx stand-in
# that forwards /api/* to api-release, api's production image, and its
# api-db, which the Worker can't do yet), runs the suite against both, then
# stops what it started (api-db only if it wasn't already running).
[tasks.e2e]
description = "Run the cross-app end-to-end suite in e2e/: typecheck, then Playwright against web-client's build in its Worker, and through a stand-in to api's production image"
depends = ["web-client:build"]
run = """
db_was_running=$(docker compose ps --quiet --status running api-db)
trap 'docker compose --profile e2e rm --stop --force web-client-worker web-client-hosting api-release; [ -n "$db_was_running" ] || docker compose rm --stop --force api-db' EXIT
docker compose --profile e2e build e2e web-client-worker web-client-hosting api-release
docker compose --profile e2e run --rm --no-deps e2e npm run typecheck
docker compose --profile e2e run --rm e2e
"""

# ---- web-client -------------------------------------------------------------
# The web client loads the core's browser build (the WebAssembly module and its
# wrapper), which core:wasm writes to the core-cache volume and the web-client
# service mounts read-only at /opt/core. So every task that serves,
# typechecks, tests or builds the web client depends on core:wasm, and with it
# everything that runs them (validate, e2e, the worker tasks, deploy, preview).

[tasks."web-client:up"]
description = "Start only web-client (Vite dev server, hot reload) and print its URL"
depends = ["core:wasm"]
run = [
  "docker compose up --detach --build --wait web-client",
  'docker compose ps --format "$DEV_PORTS_FORMAT" web-client | grep -v "^$"',
]

[tasks."web-client:down"]
description = "Stop only web-client; keeps its image and node_modules"
run = "docker compose down web-client"

[tasks."web-client:logs"]
description = "Follow web-client's logs"
run = "docker compose logs --follow --tail 100 web-client"

[tasks."web-client:shell"]
description = "Open a shell in a web-client container"
run = "docker compose run --rm web-client sh"

[tasks."web-client:exec"]
description = "Run a command in a web-client container: ./bin/mise run web-client:exec -- npx vite --version"
run = "docker compose run --rm web-client"

[tasks."web-client:install"]
description = "Install web-client dependencies; with arguments, add packages: ./bin/mise run web-client:install -- zod"
run = "docker compose run --rm web-client npm install"

[tasks."web-client:lint"]
description = "Lint web-client (oxlint)"
run = "docker compose run --rm web-client npm run lint"

[tasks."web-client:routes-check"]
description = "Fail if web-client's generated route tree (src/routeTree.gen.ts) is stale against src/routes"
run = "docker compose run --rm web-client npm run routes:check"

# The types are generated from api's OpenAPI document, so these two read
# api/openapi.json (in the web-client-openapi tool container, read-only).
[tasks."web-client:api-types"]
description = "Regenerate web-client's api types (src/api/schema.gen.ts) from api/openapi.json"
run = "docker compose --profile tools run --rm --build web-client-openapi sh scripts/api-types.sh"

[tasks."web-client:api-types-check"]
description = "Fail if web-client's generated api types (src/api/schema.gen.ts) are stale against api/openapi.json"
run = "docker compose --profile tools run --rm --build web-client-openapi sh scripts/api-types.sh --check"

[tasks."web-client:typecheck"]
description = "Typecheck web-client (tsc -b)"
depends = ["core:wasm"]
run = "docker compose run --rm web-client npx tsc -b"

[tasks."web-client:test"]
description = "Run web-client's component tests (Vitest, Testing Library, jsdom)"
depends = ["core:wasm"]
run = "docker compose run --rm web-client npm test"

[tasks."web-client:build"]
description = "Production build of web-client into web-client/dist"
depends = ["core:wasm"]
run = "docker compose run --rm web-client npm run build"

# web-client's own browser suite (web-client/e2e/, Playwright): what only a
# real browser shows about the production build by itself, such as opening
# with no connection. Builds, makes the builds the suite deploys
# (scripts/e2e-deployments.ts), serves them with vite preview
# (web-client-preview), typechecks and runs the suite, then stops what it
# started. Needs no other app.
[tasks."web-client:e2e"]
description = "Run web-client's browser suite (Playwright) against its production build, served by vite preview"
depends = ["web-client:build"]
run = """
trap 'docker compose --profile e2e rm --stop --force web-client-preview' EXIT
docker compose run --rm web-client node scripts/e2e-deployments.ts
docker compose --profile e2e build web-client-e2e web-client-preview
docker compose --profile e2e run --rm web-client-e2e npm run typecheck
docker compose --profile e2e run --rm web-client-e2e
"""

# Renders the install icons in public/icons/ from public/favicon.svg, with
# Chromium (web-client-icons). Run it after changing the icon, look at the
# PNGs, and commit them.
[tasks."web-client:icons"]
description = "Render web-client's install icons (public/icons/*.png) from public/favicon.svg"
run = "docker compose --profile tools run --rm --build web-client-icons"

# The one entry point CI calls for this app. One step at a time: the steps
# share the node_modules volume, which the first one may still be filling.
# The route tree check goes first: the build regenerates the tree in place.
# The api types check reads api/openapi.json, so a change to api's document
# fails web-client's validation until the regenerated types are committed.
# The browser suite makes the production build first; the deploy check, last,
# dry-runs the deployment of that build.
[tasks."web-client:validate"]
description = "Validate web-client: route tree check, api types check, lint, typecheck, component tests, production build, browser suite, deploy check"
run = [
  { task = "web-client:routes-check" },
  { task = "web-client:api-types-check" },
  { task = "web-client:lint" },
  { task = "web-client:typecheck" },
  { task = "web-client:test" },
  { task = "web-client:e2e" },
  { task = "web-client:deploy-check" },
]

# ---- web-client's hosting ---------------------------------------------------
# The Worker in web-client/worker/ (Cloudflare Workers) serves the production
# build. Wrangler runs in the web-client-worker service's image.

[tasks."web-client:worker-install"]
description = "Install the Worker's dependencies (web-client/worker/); with arguments, add packages: ./bin/mise run web-client:worker-install -- -D wrangler@4.155.0"
run = "docker compose run --rm --build web-client-worker npm install"

# Any Wrangler command, with the Cloudflare credentials passed through when
# they are set: ./bin/mise run web-client:wrangler -- deployments list.
[tasks."web-client:wrangler"]
description = "Run a Wrangler command for web-client's Worker: ./bin/mise run web-client:wrangler -- deployments list"
run = "docker compose run --rm --build -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID web-client-worker npx wrangler"

[tasks."web-client:worker-up"]
description = "Build web-client and serve it from the Worker in the local Workers runtime (wrangler dev), and print its URL"
depends = ["web-client:build"]
run = [
  "docker compose up --detach --build --wait web-client-worker",
  'docker compose ps --format "$DEV_PORTS_FORMAT" web-client-worker | grep -v "^$"',
]

[tasks."web-client:worker-down"]
description = "Stop the Worker in the local Workers runtime"
run = "docker compose rm --stop --force web-client-worker"

# What can be proven about deploying without credentials: the Worker
# typechecks; Wrangler accepts the configuration and bundles the Worker with
# the build in web-client/dist (dry runs of the deploy script: nothing is
# uploaded, nothing asks for a login), for the production Worker by default
# and for a trial Worker by name; the deploy refuses to start without
# credentials; the preview delete refuses every name but fortymm-pr-<number>,
# the production Worker's above all; and web-client:preview refuses the
# production Worker. Reads web-client/dist, so web-client:validate runs it
# after the build.
[tasks."web-client:deploy-check"]
description = "Check web-client's Worker is deployable, without credentials: typecheck, deployment dry runs, credential check"
run = """
dry_runs=web-client/worker/.wrangler/dry-run
rm -rf "$dry_runs"
docker compose build web-client-worker
docker compose run --rm web-client-worker sh -c 'npm run types && npm run typecheck'
docker compose run --rm web-client-worker env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID sh -c '
  sh scripts/deploy.sh "" --dry-run --outdir .wrangler/dry-run/default &&
  sh scripts/deploy.sh fortymm-trial --dry-run --outdir .wrangler/dry-run/trial'
for expected in 'default:the worker "fortymm"' 'trial:the worker "fortymm-trial"'; do
  if ! grep -qF "${expected#*:}" "$dry_runs/${expected%%:*}/README.md"; then
    echo "web-client:deploy-check: the ${expected%%:*} dry run did not target ${expected#*:}: $(cat "$dry_runs/${expected%%:*}/README.md")" >&2
    exit 1
  fi
  echo "The ${expected%%:*} dry run targets ${expected#*:}."
done
if out=$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID sh web-client/worker/scripts/with-credentials.sh 2>&1); then
  echo "web-client:deploy-check: the deploy would start without credentials." >&2
  exit 1
fi
case "$out" in
  *"missing credentials: CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID."*) echo "Without credentials, the deploy stops with: $out" ;;
  *) echo "web-client:deploy-check: the deploy stopped without credentials, but said: $out" >&2; exit 1 ;;
esac
# The preview delete refuses every name but fortymm-pr-<number>, before
# reaching Cloudflare: the production Worker's above all.
for name in fortymm fortymm-trial '' fortymm-pr- fortymm-pr-9x 'fortymm-pr-9 fortymm' fortymm-pr--9 x-fortymm-pr-9 'fortymm-pr-9/..'; do
  if out=$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID sh web-client/worker/scripts/delete-preview.sh "$name" 2>&1); then
    echo "web-client:deploy-check: the preview delete accepted '$name'." >&2
    exit 1
  fi
  case "$out" in
    *"refusing '$name': not a pull request's preview Worker"*) ;;
    *) echo "web-client:deploy-check: the preview delete stopped at '$name', but said: $out" >&2; exit 1 ;;
  esac
done
if out=$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID sh web-client/worker/scripts/delete-preview.sh fortymm-pr-9 fortymm 2>&1); then
  echo "web-client:deploy-check: the preview delete accepted two names." >&2
  exit 1
fi
if out=$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID sh web-client/worker/scripts/delete-preview.sh fortymm-pr-9 2>&1); then
  echo "web-client:deploy-check: the preview delete ran without credentials." >&2
  exit 1
fi
case "$out" in
  *"missing credentials"*) echo "The preview delete refuses every name but fortymm-pr-<number> (fortymm included); fortymm-pr-9 gets past the name and stops at the credentials." ;;
  *) echo "web-client:deploy-check: the preview delete stopped at fortymm-pr-9, but said: $out" >&2; exit 1 ;;
esac
# A tested deployment (web-client:preview) never targets production.
if out=$(env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID ./bin/mise run web-client:preview -- fortymm 2>&1); then
  echo "web-client:deploy-check: web-client:preview accepted the production Worker." >&2
  exit 1
fi
case "$out" in
  *"refusing 'fortymm': nothing is tested against the production Worker"*) echo "web-client:preview refuses the production Worker." ;;
  *) echo "web-client:deploy-check: web-client:preview stopped at fortymm, but said: $out" >&2; exit 1 ;;
esac
"""

# Builds web-client and deploys it to Cloudflare with the Worker's
# configuration, and nothing more: no checks against the address, since
# nothing is tested against production. It writes the deployed address to
# web-client/worker/.wrangler/address (for web-client:preview and CI's job
# summary). CI's deploy job runs it on main, to the production Worker.
[tasks."web-client:deploy"]
description = "Deploy web-client to Cloudflare Workers, no checks (needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); another Worker: -- <name>"
usage = 'arg "[worker]" help="The Worker to deploy to; without it, the production Worker named in web-client/worker/wrangler.jsonc" default=""'
run = """
set -o pipefail
sh web-client/worker/scripts/with-credentials.sh
rm -f web-client/worker/.wrangler/address
./bin/mise run web-client:build
log=$(mktemp)
trap 'rm -f "$log"' EXIT
docker compose build web-client-worker
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID web-client-worker \
  sh scripts/with-credentials.sh sh scripts/deploy.sh "$usage_worker" | tee "$log"
address=$(grep -Eo 'https://[A-Za-z0-9.-]+[.]workers[.]dev' "$log" | head -n 1 || true)
if [ -z "$address" ]; then
  echo "web-client:deploy: deployed, but found no workers.dev address in Wrangler's output." >&2
  exit 1
fi
mkdir -p web-client/worker/.wrangler
echo "$address" > web-client/worker/.wrangler/address
echo "web-client:deploy: deployed to $address"
"""

# A deployment that is tested: deploys web-client to the named Worker, never
# the production one, then runs the hosting checks against its address. CI's
# preview job runs it for each pull request (fortymm-pr-<number>); a person
# can run it with their own token to a trial Worker (fortymm-trial).
[tasks."web-client:preview"]
description = "Deploy web-client to a non-production Worker and run the hosting checks against it: ./bin/mise run web-client:preview -- fortymm-trial"
usage = 'arg "<worker>" help="The Worker to deploy to, e.g. fortymm-pr-9 or fortymm-trial; never the production one"'
run = '''
production=$(sed -n 's/^  "name": "\(.*\)",$/\1/p' web-client/worker/wrangler.jsonc)
if [ -z "$production" ] || [ "$usage_worker" = "$production" ]; then
  echo "web-client:preview: refusing '$usage_worker': nothing is tested against the production Worker ('$production'). Deploy it with web-client:deploy." >&2
  exit 2
fi
./bin/mise run web-client:deploy -- "$usage_worker"
./bin/mise run web-client:hosting-check -- "$(cat web-client/worker/.wrangler/address)"
'''

# Deletes a pull request's preview Worker (fortymm-pr-<number>), and refuses
# any other name, the production Worker's included, before reaching
# Cloudflare. A preview that doesn't exist is not an error. CI's cleanup
# workflow runs it when a pull request closes.
[tasks."web-client:preview-delete"]
description = "Delete a pull request's preview Worker, only ever fortymm-pr-<number>: ./bin/mise run web-client:preview-delete -- fortymm-pr-9"
usage = 'arg "<worker>" help="The preview Worker to delete: fortymm-pr-<number>"'
run = """
sh web-client/worker/scripts/delete-preview.sh --check-name "$usage_worker"
docker compose build web-client-worker
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID web-client-worker \
  sh scripts/delete-preview.sh "$usage_worker"
"""

# The cross-app suite's hosting tests (the Playwright project "worker" in
# e2e/), against any address that serves this checkout's build
# (web-client/dist): a deployment on Cloudflare's edge, or the local Workers
# runtime. The same tests the e2e task runs against web-client-worker. They
# wait first, up to two minutes, until the address serves that build.
[tasks."web-client:hosting-check"]
description = "Run the hosting checks (e2e/, project worker) against an address: ./bin/mise run web-client:hosting-check -- https://fortymm-trial.<subdomain>.workers.dev"
usage = 'arg "<address>" help="The address that serves the web client, e.g. https://fortymm.<subdomain>.workers.dev"'
run = """
docker compose --profile e2e build e2e
docker compose --profile e2e run --rm --no-deps e2e npm run typecheck
docker compose --profile e2e run --rm --no-deps -e WORKER_URL="$usage_address" -e STAND_IN_URL= e2e
"""

# ---- api --------------------------------------------------------------------
# api's tasks run in the api service's container. Static checks use --no-deps;
# the tasks that need the database start api-db through depends_on, and remove
# it again afterwards unless it was already running.

[tasks."api:up"]
description = "Start only api (uvicorn --reload) and its database, and print their URLs"
run = [
  "docker compose up --detach --build --wait api",
  'docker compose ps --format "$DEV_PORTS_FORMAT" api api-db | grep -v "^$"',
]

[tasks."api:down"]
description = "Stop only api and its database; keeps their images, venv and data"
run = "docker compose down api api-db"

[tasks."api:logs"]
description = "Follow the logs of api and its database"
run = "docker compose logs --follow --tail 100 api api-db"

[tasks."api:shell"]
description = "Open a shell in an api container"
run = "docker compose run --rm --no-deps api bash"

[tasks."api:exec"]
description = "Run a command in an api container: ./bin/mise run api:exec -- python --version"
run = "docker compose run --rm --no-deps api"

[tasks."api:install"]
description = "Install api dependencies, updating uv.lock; with arguments, add packages: ./bin/mise run api:install -- --dev pytest-xdist"
run = "docker compose run --rm --no-deps api dev-install"

[tasks."api:lint"]
description = "Lint api (ruff check)"
run = "docker compose run --rm --no-deps api ruff check"

[tasks."api:format"]
description = "Format api's code in place (ruff format)"
run = "docker compose run --rm --no-deps api ruff format"

[tasks."api:format-check"]
description = "Check api's formatting without changing files (ruff format --check)"
run = "docker compose run --rm --no-deps api ruff format --check"

[tasks."api:typecheck"]
description = "Typecheck api (mypy --strict)"
run = "docker compose run --rm --no-deps api mypy"

[tasks."api:lock-check"]
description = "Check that api/uv.lock matches api/pyproject.toml"
run = "docker compose run --rm --no-deps api uv lock --check"

[tasks."api:openapi"]
description = "Write api's OpenAPI document to api/openapi.json"
run = "docker compose run --rm --no-deps api python -m api.openapi openapi.json"

[tasks."api:openapi-check"]
description = "Check that api/openapi.json is the document api serves"
run = "docker compose run --rm --no-deps api python -m api.openapi openapi.json --check"

# Compares the working tree's api/openapi.json with the copy committed on a base
# git ref, and fails on a change that breaks existing clients (oasdiff level
# ERR: a removed path or required field, a new required parameter, ...).
# Additive changes pass. A base without the file passes: nothing to break.
# CI passes HEAD^ (see .github/workflows/ci.yml); locally the default is
# origin/main, so run `git fetch origin main` first.
[tasks."api:openapi-breaking"]
description = "Fail if api/openapi.json breaks clients of the copy on a git ref (default origin/main): ./bin/mise run api:openapi-breaking -- HEAD^"
usage = 'arg "[base]" help="The git ref to compare with" default="origin/main"'
run = """
base="$usage_base"
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
  echo "api:openapi-breaking: git ref '$base' not found. Fetch it first, e.g. git fetch origin main." >&2
  exit 2
fi
if ! git cat-file -e "$base:api/openapi.json" 2>/dev/null; then
  echo "api:openapi-breaking: $base has no api/openapi.json, so no client can depend on it yet. Nothing to compare; passing."
  exit 0
fi
echo "api:openapi-breaking: comparing api/openapi.json with $base:api/openapi.json"
git show "$base:api/openapi.json" \
  | docker compose --profile tools run --rm -T api-oasdiff \
      breaking - /revision/openapi.json --fail-on ERR --color never --allow-external-refs=false
echo "api:openapi-breaking: no breaking changes."
"""

[tasks."api:test"]
description = "Test api in process against a real PostgreSQL (pytest); arguments go to pytest"
run = """
db_was_running=$(docker compose ps --quiet --status running api-db)
trap '[ -n "$db_was_running" ] || docker compose rm --stop --force api-db' EXIT
docker compose run --rm api pytest
"""

# The one entry point CI calls for this app. One step at a time: the steps
# share the venv volume, which the first one may still be filling. The suite
# against the shipped image is part of validating the api: it is something the
# api proves by itself, with the database it owns.
[tasks."api:validate"]
description = "Validate api: lockfile, lint, formatting, typecheck, OpenAPI drift, tests, its shipped image, and its hosting setup's credential check"
run = [
  { task = "api:lock-check" },
  { task = "api:lint" },
  { task = "api:format-check" },
  { task = "api:typecheck" },
  { task = "api:openapi-check" },
  { task = "api:test" },
  { task = "api:e2e" },
  { task = "api:deploy-check" },
]

# Builds api's production image, runs it as api-release against api-db, runs
# the pytest suite in api/e2e/ against it, then stops what it started.
[tasks."api:e2e"]
description = "End-to-end test api: its production image against a real PostgreSQL"
run = """
db_was_running=$(docker compose ps --quiet --status running api-db)
trap 'docker compose --profile e2e rm --stop --force api-release; [ -n "$db_was_running" ] || docker compose rm --stop --force api-db' EXIT
docker compose --profile e2e build api-release api-e2e
docker compose --profile e2e run --rm api-e2e
"""

# ---- api's hosting ----------------------------------------------------------
# The Google Cloud project the api's pull request previews run in: a Cloud
# Run service and a database on one shared Cloud SQL instance per pull
# request. gcloud runs in the api-hosting service's image, with its login in
# the api-hosting-gcloud volume. api/README.md, "Hosting", has the details.

# Any gcloud command, with the kept login: ./bin/mise run api:gcloud -- auth
# login, then e.g. ./bin/mise run api:gcloud -- run services list.
[tasks."api:gcloud"]
description = "Run a gcloud command for api's hosting, with the login kept in a Docker volume: ./bin/mise run api:gcloud -- auth login"
run = "docker compose --profile tools run --rm --build api-hosting gcloud"

# Creates what the previews need in the project and changes nothing already in
# place (api/hosting/setup.sh); a second run changes nothing and says so.
# Needs an owner's login (api:gcloud -- auth login).
[tasks."api:hosting-setup"]
description = "Prepare the Google Cloud project for api's pull request previews; re-runnable, changes nothing already in place"
run = "docker compose --profile tools run --rm --build api-hosting bash setup.sh"

# Changes nothing: reports each item the setup makes as in place, missing or
# different, then asks Google Cloud, as the deployer, what it may and may not
# do. Fails if anything is missing or wrong.
[tasks."api:hosting-check"]
description = "Check the Google Cloud project has everything api's previews need, and the deployer no more, changing nothing"
run = "docker compose --profile tools run --rm --build api-hosting bash setup.sh --check"

# A pull request's preview, or a trial: builds api's production image for
# linux/amd64, pushes it to the preview's own image package, creates the
# preview's database if it doesn't exist (a redeploy keeps it), deploys the
# Cloud Run service pinned to the pushed digest (api/hosting/preview.sh), then
# runs api's end-to-end suite against its address (api:preview-check). It
# writes the address to api/hosting/.preview/address (CI's job summary reads
# it). The name is checked first, before anything else runs
# (api/hosting/preview-name.sh): fortymm-api-pr-<number> (CI's preview job),
# or fortymm-api-trial to try a branch by hand. As the deployer: in CI through
# Workload Identity Federation (google-github-actions/auth's credential file,
# which api/hosting/run.sh mounts), on a laptop by impersonating it with the
# kept login.
[tasks."api:preview"]
description = "Deploy a preview of api to Cloud Run with its own database, then run api's end-to-end suite against it: ./bin/mise run api:preview -- fortymm-api-pr-9"
usage = 'arg "<service>" help="The preview: fortymm-api-pr-<number>, or fortymm-api-trial"'
run = """
set -o pipefail
sh api/hosting/preview-name.sh "$usage_service" >/dev/null
mkdir -p api/hosting/.preview
rm -f api/hosting/.preview/address
image="$COMPOSE_PROJECT_NAME-api-preview:local"
docker build --platform linux/amd64 --provenance=false --sbom=false --tag "$image" api
docker compose --profile tools build api-hosting
log=$(mktemp)
trap 'rm -f "$log"' EXIT
sh api/hosting/run.sh bash preview.sh "$usage_service" "$image" "$(git rev-parse --short=12 HEAD)" | tee "$log"
address=$(sed -n 's/^api:preview: address //p' "$log")
echo "$address" > api/hosting/.preview/address
./bin/mise run api:preview-check -- "$address"
"""

# api's end-to-end suite (api/e2e/: the health journey, the database
# answering) against a deployed address instead of api-release. api:preview
# runs it last, so a preview that fails it fails the task.
[tasks."api:preview-check"]
description = "Run api's end-to-end suite against a deployed address: ./bin/mise run api:preview-check -- https://fortymm-api-pr-9-89514061125.northamerica-northeast2.run.app"
usage = 'arg "<address>" help="The deployed api, e.g. https://fortymm-api-pr-9-89514061125.northamerica-northeast2.run.app"'
run = """
docker compose --profile e2e build api-e2e
docker compose --profile e2e run --rm --no-deps -e BASE_URL="$usage_address" api-e2e
"""

# Deletes a pull request's preview: its service, then its database, then its
# image package (api/hosting/delete-preview.sh). Only ever
# fortymm-api-pr-<number>: any other name is refused on the host, before the
# container starts. Something already gone is not an error. CI's cleanup
# workflow runs it when a pull request closes.
[tasks."api:preview-delete"]
description = "Delete a pull request's api preview (service, database, image), only ever fortymm-api-pr-<number>: ./bin/mise run api:preview-delete -- fortymm-api-pr-9"
usage = 'arg "<service>" help="The preview to delete: fortymm-api-pr-<number>"'
run = """
sh api/hosting/preview-name.sh --deletable "$usage_service" >/dev/null
docker compose --profile tools build api-hosting
sh api/hosting/run.sh bash delete-preview.sh "$usage_service"
"""

# What can be proven about api's hosting without credentials
# (api/hosting/deploy-check.sh): the setup, the check, the preview and the
# preview delete stop, saying what is missing, before reading or changing
# anything in Google Cloud; the preview names map to their own databases; and
# the delete refuses every name but fortymm-api-pr-<number> before the
# container starts. The last step of api:validate.
[tasks."api:deploy-check"]
description = "Check, without credentials, api's hosting scripts: they stop before touching Google Cloud, and the preview names and refusals"
run = "sh api/hosting/deploy-check.sh"

# ---- core -------------------------------------------------------------------
# The shared core library (Rust) in core/. It is a library, so there is no
# core:up: each task runs one command in the core service's container. The
# toolchain is pinned by dev/core/Dockerfile; cargo's downloads and build
# output stay in the core-cache volume.

[tasks."core:shell"]
description = "Open a shell in a core container"
run = "docker compose --profile tools run --rm core bash"

[tasks."core:exec"]
description = "Run a command in a core container: ./bin/mise run core:exec -- cargo tree"
run = "docker compose --profile tools run --rm core"

[tasks."core:install"]
description = "Update core/Cargo.lock to match the Cargo.toml files; with arguments, add packages: ./bin/mise run core:install -- --dev hex"
run = "docker compose --profile tools run --rm core dev-install"

[tasks."core:lint"]
description = "Lint core (clippy, warnings are errors)"
run = "docker compose --profile tools run --rm core cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."core:format"]
description = "Format core's code in place (rustfmt)"
run = "docker compose --profile tools run --rm core cargo fmt --all"

[tasks."core:format-check"]
description = "Check core's formatting without changing files (rustfmt --check)"
run = "docker compose --profile tools run --rm core cargo fmt --all --check"

[tasks."core:test"]
description = "Test core (cargo test); arguments go to cargo test: ./bin/mise run core:test -- --test sizes -- --nocapture"
run = "docker compose --profile tools run --rm core cargo test --locked"

[tasks."core:build"]
description = "Release build of core, for the container's own platform"
run = "docker compose --profile tools run --rm core cargo build --locked --release"

# The two targets that exist today. Each builds the bindings and runs the
# golden vectors (core/vectors/vectors.json) through them. Output stays in the
# core-cache volume.
[tasks."core:wasm"]
description = "Build core for browsers (WebAssembly), report its size, run the golden vectors from Node"
run = "docker compose --profile tools run --rm core sh bindings/wasm/build-and-check.sh"

[tasks."core:python"]
description = "Build core as a Python module for the server and run the golden vectors from Python"
run = "docker compose --profile tools run --rm core sh bindings/python/build-and-check.sh"

# The one entry point CI calls for this app. One step at a time: the steps
# share the cargo cache volume, which the first one may still be filling.
[tasks."core:validate"]
description = "Validate core: formatting, lint, tests, release build, then the golden vectors through the WebAssembly and Python builds"
run = [
  { task = "core:format-check" },
  { task = "core:lint" },
  { task = "core:test" },
  { task = "core:build" },
  { task = "core:wasm" },
  { task = "core:python" },
]
