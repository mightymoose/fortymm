[tools]
node = "26.1.0"
python = "3.13"

[tasks.redeploy-uat]
description = "Rebuild and restart the fortymm-uat docker stack; smoke-check https://uat.fortymm.com"
run = "./scripts/redeploy-uat.sh"

[tasks.regen-api-types]
description = "Start API (if not running) and regenerate OpenAPI types for web-client"
run = """
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(pwd)"
API_HOST="${API_HOST:-127.0.0.1}"
API_PORT="${API_PORT:-8000}"
API_URL="http://${API_HOST}:${API_PORT}"

probe() { curl -fs -o /dev/null --max-time 1 "$API_URL/openapi.json"; }

API_PID=""
cleanup() { [ -n "$API_PID" ] && kill "$API_PID" 2>/dev/null || true; }
trap cleanup EXIT

if probe; then
  echo "Using API already running at $API_URL"
else
  echo "Starting API server at $API_URL..."
  cd "$ROOT/api"
  if [ ! -x ".venv/bin/uvicorn" ]; then
    python -m venv .venv
    .venv/bin/pip install -q -e '.[dev]'
  fi
  .venv/bin/uvicorn app.main:app --host "$API_HOST" --port "$API_PORT" \\
    >/tmp/fortymm-api.log 2>&1 &
  API_PID=$!
  cd "$ROOT"

  for _ in $(seq 1 60); do
    if probe; then break; fi
    sleep 0.5
  done
  if ! probe; then
    echo "API failed to start. Last log:" >&2
    tail -n 40 /tmp/fortymm-api.log >&2 || true
    exit 1
  fi
fi

cd "$ROOT/web-client"
[ -d node_modules ] || npm ci
API_URL="$API_URL" npm run gen:api
echo "Wrote web-client/src/api/schema.d.ts"
"""
