# Host config: tasks that drive the Docker Compose stack.
# Tool versions used inside the dev container live in mise.container.toml.

[env]
# Where the API is deployed (see CLAUDE.md's Deploy section). Override either
# in the environment to deploy elsewhere.
GCP_PROJECT = "{{ get_env(name='GCP_PROJECT', default='fortymm') }}"
GCP_REGION = "{{ get_env(name='GCP_REGION', default='us-central1') }}"

[tasks.up]
description = "Start the local dev stack: the API and the web-client dev server, which proxies /api to it"
depends = ["api:dev", "web-client:dev"]

[tasks.ci]
description = "Bring up the stack in the background, run every CI check inside it, then tear it down"
run = """
docker compose up -d --build --wait
trap 'docker compose rm --force --stop >/dev/null 2>&1' EXIT INT TERM
./bin/mise run api:ci
./bin/mise run api:smoke
./bin/mise run web-client:ci
./bin/mise run openapi:check
./bin/mise run openapi:breaking
./bin/mise run web-client:e2e
"""

[tasks."openapi:check"]
description = "Regenerate the OpenAPI schema and the web-client's types in the running stack and fail if they differ from what's committed (start it with `mise run ci`)"
# Expects node_modules installed (web-client:ci runs `npm ci` first).
run = """
files="api/openapi.json web-client/src/api/schema.d.ts"
docker compose exec -T api /app/bin/docker-entrypoint uv run --locked python -m fortymm_api.openapi
docker compose exec -T -w /app/web-client dev /app/bin/docker-entrypoint npm run generate:api
# --porcelain also lists the files if they're new or deleted, not just changed.
if [ -n "$(git status --porcelain -- $files)" ]; then
  git --no-pager diff -- $files
  echo "The generated OpenAPI files are out of date: run ./bin/mise run api:openapi and commit the result." >&2
  exit 1
fi
"""

[tasks."openapi:breaking"]
description = "Fail if api/openapi.json breaks the published API compared with the main it builds on, except for the breaks this change adds to api/openapi-breaking-ignore.txt (start the stack with `mise run ci`)"
# git runs on the host: in a git worktree, .git points outside the bind mount.
# OPENAPI_BASE is the commit main pointed at before a push to main (CI sets it).
run = '''
ignore=api/openapi-breaking-ignore.txt
case "${OPENAPI_BASE:-}" in
  "" | *[!0]*) ;;
  *) OPENAPI_BASE= ;;
esac
base=${OPENAPI_BASE:-$(git merge-base HEAD origin/main)}
if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
  echo "The base commit $base isn't in this clone, so the breaking-change check can't run." >&2
  exit 1
fi
if ! git cat-file -e "$base:api/openapi.json" 2>/dev/null; then
  echo "The base commit $base has no api/openapi.json, so there's nothing to check for breaking changes."
  exit 0
fi
echo "Checking api/openapi.json for breaking changes since $base"
# Inside the checkout, so the dev container sees it through the bind mount.
tmp=$(mktemp -d .openapi-breaking.XXXXXX)
trap 'rm -rf "$tmp"' EXIT INT TERM
git show "$base:api/openapi.json" >"$tmp/base.json"
# Only the lines this change adds count, so an override expires once it's on
# main and can't hide a later break.
git diff "$base" -- "$ignore" | sed -n 's/^+\([^+#].*\)/\1/p' >"$tmp/ignore.txt"
if [ -s "$tmp/ignore.txt" ]; then
  echo "Ignoring the breaks this change adds to $ignore:"
  cat "$tmp/ignore.txt"
fi
docker compose exec -T dev /app/bin/docker-entrypoint oasdiff breaking \
  "$tmp/base.json" api/openapi.json --fail-on ERR --err-ignore "$tmp/ignore.txt" || {
  echo "api/openapi.json breaks /v1. Put a deliberate break in a new API version, or, before the first app release, add the error's line (METHOD PATH description) to $ignore." >&2
  exit 1
}
'''

[tasks."api:ci"]
description = "Lint, typecheck and test the API inside the running api container (start it with `mise run ci`)"
# exec bypasses the image entrypoint, so call it to get the container's tools on PATH.
run = "docker compose exec -T api /app/bin/docker-entrypoint sh -c 'uv sync --locked && uv run ruff check && uv run ruff format --check && uv run mypy src tests && uv run pytest'"

[tasks."api:test"]
description = "Run the API's tests inside the api container"
run = """
# --no-deps keeps run from starting dev. The tests need only the database, so
# start it first.
docker compose up -d --wait postgres
docker compose run --rm --no-deps -T api uv run --locked pytest
"""

[tasks."api:dev"]
description = "Start the API with auto-reload and stream its logs; reach it through the web-client dev server at /api"
run = "docker compose up --build api"

[tasks."api:openapi"]
description = "Regenerate api/openapi.json from the app, then the web-client's types from it"
run = """
docker compose run --rm -T api uv run --locked python -m fortymm_api.openapi
docker compose run --rm -T -w /app/web-client dev sh -c 'npm install && npm run generate:api'
"""

[tasks."api:build"]
description = "Build the API's production image (api/Dockerfile) as fortymm-api-production, with the Python and uv versions pinned in mise.container.toml"
# Not fortymm-api: that's what Compose names the dev `api` service's image.
run = '''
version() { sed -nE "s/^$1 = \"(.*)\"/\1/p" mise.container.toml; }
docker build -t fortymm-api-production \
  --build-arg PYTHON_VERSION="$(version python)" --build-arg UV_VERSION="$(version uv)" api
'''

[tasks."api:smoke"]
description = "Build the API's production image, run it with PORT set against the Compose database, and check that /v1/health reaches it"
depends = ["api:build"]
# {% raw %} keeps mise's Tera templating away from docker's Go template.
run = '''
docker compose up -d --wait postgres
network=$(docker inspect "$(docker compose ps -q postgres)" \
  -f '{% raw %}{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}{% endraw %}')
id=$(docker run -d --rm -e PORT=8080 -p 8080 --network "$network" \
  -e DATABASE_URL=postgresql://fortymm:fortymm@postgres:5432/fortymm fortymm-api-production)
trap 'docker stop "$id" >/dev/null' EXIT INT TERM
port=$(docker port "$id" 8080/tcp | head -n 1)
for i in $(seq 30); do
  body=$(curl -sf "http://localhost:${port##*:}/v1/health") && break
  sleep 1
done
if [ "${body:-}" != '{"data":{"database":"ok"}}' ]; then
  echo "the production image didn't answer /v1/health with {\"data\":{\"database\":\"ok\"}} (got: ${body:-nothing})" >&2
  docker logs "$id" >&2
  exit 1
fi
echo "the production image answers /v1/health: $body"
'''

[tasks."api:deploy"]
description = "Build the API's production image, push it to Artifact Registry and deploy it to the `api` Cloud Run service with all traffic (needs gcloud, authenticated); prints the service URL last"
depends = ["api:build"]
run = "api/deploy/cloud-run-deploy"

[tasks."api:preview"]
description = "Like api:deploy, but to a revision of the `api-preview` service tagged with the branch's Preview name, with no traffic; prints its URL last"
depends = ["api:build"]
run = 'api/deploy/cloud-run-deploy --tag "$(bin/preview-name)"'

[tasks."api:preview-delete"]
description = "Remove a branch's Preview tag from the `api-preview` Cloud Run service (needs gcloud, authenticated); succeeds if the tag or the service isn't there"
usage = 'arg "<branch>" help="The git branch whose Preview to remove"'
# The revision itself stays, untagged and without traffic: Cloud Run keeps a
# limited number of revisions per service and an idle one costs nothing.
run = """
name=$(bin/preview-name "$usage_branch")
# list (unlike describe) succeeds with no output when the service is missing,
# so an auth or API error still fails the task.
service=$(gcloud run services list --project "$GCP_PROJECT" --region "$GCP_REGION" --filter=metadata.name=api-preview --format='value(metadata.name)')
if [ -z "$service" ]; then
  echo "api-preview doesn't exist, so there's no $name tag to remove"
  exit 0
fi
tags=$(gcloud run services describe api-preview --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(spec.traffic[].tag)')
if ! printf '%s\n' "$tags" | tr ';' '\n' | grep -qx "$name"; then
  echo "api-preview has no $name tag to remove"
  exit 0
fi
gcloud run services update-traffic api-preview --project "$GCP_PROJECT" --region "$GCP_REGION" --remove-tags "$name" --quiet
"""

[tasks."api:url"]
description = "Print the production API's Cloud Run URL (pass it to web-client:deploy as API_ORIGIN)"
quiet = true
run = "gcloud run services describe api --project \"$GCP_PROJECT\" --region \"$GCP_REGION\" --format='value(status.url)'"

[tasks."web-client:ci"]
description = "Install, lint, build and test the web-client inside the running dev container (start it with `mise run ci`)"
# exec bypasses the image entrypoint, so call it to get the container's tools on PATH.
run = "docker compose exec -T -w /app/web-client dev /app/bin/docker-entrypoint sh -c 'npm ci && npm run lint && npm run build && npm test'"

[tasks."web-client:e2e"]
description = "Start the dev server in the running dev container and run the Playwright suite against it (start the stack with `mise run ci`)"
# Expects node_modules installed (web-client:ci runs `npm ci` first).
# Traces and the HTML report land in web-client/test-results and
# web-client/playwright-report on the host.
run = """
docker compose exec -d -T -w /app/web-client dev /app/bin/docker-entrypoint npm run dev
docker compose exec -T playwright sh -c '
  for i in $(seq 60); do curl -sf -o /dev/null http://localhost:5173 && exit 0; sleep 1; done
  echo "dev server did not start on :5173" >&2; exit 1'
docker compose exec -T playwright npx playwright test
"""

[tasks."web-client:e2e-deployed"]
description = "Run the post-deploy Playwright suite (web-client/e2e/deployed) against DEPLOY_URL, e.g. a Cloudflare Preview or https://fortymm.com"
# Expects node_modules installed (web-client:ci runs `npm ci` first). Starts
# only the playwright container (and dev, whose network it shares). Traces and
# the HTML report land in web-client/test-results/deployed and
# web-client/playwright-report/deployed on the host.
run = """
if [ -z "${DEPLOY_URL:-}" ]; then
  echo "DEPLOY_URL is not set: point it at the deployment to check, e.g. DEPLOY_URL=https://fortymm.com" >&2
  exit 1
fi
docker compose up -d --wait playwright
trap 'docker compose rm --force --stop >/dev/null 2>&1' EXIT INT TERM
docker compose exec -T -e PLAYWRIGHT_BASE_URL="$DEPLOY_URL" playwright \
  npx playwright test -c playwright.deployed.config.ts
"""

[tasks."web-client:deploy"]
description = "Deploy web-client/dist and its Worker to Cloudflare Workers (needs a build, e.g. from `mise run ci`, CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, API_ORIGIN, the API's URL from `mise run api:url`, and WORKER_SECRET, the Worker secret)"
# Uses the node_modules volume `npm ci` filled; `run` works after `ci` has
# removed the stack's containers. The Worker forwards /api/* to API_ORIGIN.
run = """
[ -n "${API_ORIGIN:-}" ] || echo "warning: API_ORIGIN is empty, so the Worker will answer /api/* with a 503" >&2
[ -n "${WORKER_SECRET:-}" ] || echo "warning: WORKER_SECRET is empty, so the API will answer the Worker with a 403" >&2
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -e WORKER_SECRET -w /app/web-client dev \
  sh -c '
    # wrangler reads the Worker secret from a file, which has to be inside the
    # container. The container is removed afterwards, and the file with it.
    if [ -n "${WORKER_SECRET:-}" ]; then
      file=$(mktemp)
      echo "WORKER_SECRET=$WORKER_SECRET" >"$file"
      set -- "$@" --secrets-file "$file"
    fi
    exec "$@"' sh npx wrangler deploy --var "API_ORIGIN:${API_ORIGIN:-}"
"""

[tasks."web-client:preview"]
description = "Upload web-client/dist and its Worker as a Cloudflare Workers Preview named after the current git branch (same needs as web-client:deploy, with API_ORIGIN the URL `mise run api:preview` printed)"
run = """
[ -n "${API_ORIGIN:-}" ] || echo "warning: API_ORIGIN is empty, so the Worker will answer /api/* with a 503" >&2
[ -n "${WORKER_SECRET:-}" ] || echo "warning: WORKER_SECRET is empty, so the API will answer the Worker with a 403" >&2
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -e WORKER_SECRET -w /app/web-client dev \
  sh -c '
    # As in web-client:deploy.
    if [ -n "${WORKER_SECRET:-}" ]; then
      file=$(mktemp)
      echo "WORKER_SECRET=$WORKER_SECRET" >"$file"
      set -- "$@" --secrets-file "$file"
    fi
    exec "$@"' sh npx wrangler preview --name "$(bin/preview-name)" --var "API_ORIGIN:${API_ORIGIN:-}"
"""

[tasks."web-client:preview-delete"]
description = "Delete a branch's Cloudflare Workers Preview (needs CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID); succeeds if there's no such Preview"
usage = 'arg "<branch>" help="The git branch whose Preview to delete"'
# npm ci first, so npx runs the locked wrangler even when the node_modules
# volume is empty (as in the preview-cleanup workflow).
run = """
name=$(bin/preview-name "$usage_branch")
docker compose run --rm -T -w /app/web-client dev npm ci
log=$(mktemp)
trap 'rm -f "$log"' EXIT
status=0
docker compose run --rm -T -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -w /app/web-client dev \
  npx wrangler preview delete --name "$name" -y >"$log" 2>&1 || status=$?
cat "$log"
# wrangler has no way to check for a Preview first, and fails when it's
# missing, so read its error instead: only the Preview API request failing
# with "not found" counts, not a config or auth error.
if [ "$status" -ne 0 ]; then
  if grep -q 'Cloudflare API (.*/previews/.*) failed' "$log" &&
    grep -Eqi 'not found|does not exist|could not be found' "$log"; then
    echo "There's no Preview named $name to delete"
    exit 0
  fi
  exit "$status"
fi
"""

[tasks."web-client:test"]
description = "Run the web-client unit tests inside the dev container"
run = "docker compose run --rm -w /app/web-client dev sh -c 'npm install && npm test'"

[tasks."web-client:dev"]
description = "Start the web-client Vite dev server inside the dev container on a free host port"
run = """
name="fortymm-web-client-dev-$$"
docker compose run -d --rm --service-ports --name "$name" -l fortymm.task=web-client-dev \
  -w /app/web-client dev \
  sh -c 'npm install && npm run dev' >/dev/null
trap 'docker stop "$name" >/dev/null 2>&1' EXIT INT TERM
port=$(docker port "$name" 5173/tcp | head -n 1)
echo "web-client dev server: http://localhost:${port##*:}"
docker logs -f "$name"
"""

[tasks.list-ports]
description = "Print the published host ports of everything running from this checkout"
# {% raw %} keeps mise's Tera templating away from docker's Go template.
run = """
docker ps \
  --filter "label=com.docker.compose.project.working_dir=$PWD" \
  --format '{% raw %}{{if .Label "fortymm.task"}}{{.Label "fortymm.task"}}{{else}}{{.Label "com.docker.compose.service"}}{{end}} {{.ID}}{% endraw %}' |
while read -r name id; do
  # Each mapping looks like "5173/tcp -> 0.0.0.0:32768" (repeated for IPv6).
  docker port "$id" | while read -r mapping; do
    printf '%-20s %-10s localhost:%s\n' "$name" "${mapping%% *}" "${mapping##*:}"
  done | sort -u
done
"""
