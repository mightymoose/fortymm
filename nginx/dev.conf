upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web-client:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (FastMCP Streamable-HTTP mount at /mcp), reached via /api/mcp/. Longer,
    # more-specific prefix than /api/, so buffering OFF + a long read timeout keep
    # a streamed/idle connection alive past nginx's default 60s.
    location /api/mcp/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A bare /mcp/ hit (not via /api/) reaches the same FastMCP mount directly.
    location /mcp/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 9728 protected-resource metadata for the MCP OAuth Resource Server.
    # The server advertises this URL at the PUBLIC ORIGIN ROOT via the 401
    # `WWW-Authenticate: Bearer resource_metadata="…"` challenge on /mcp/, in the
    # RFC 9728 path-insertion form (e.g. /.well-known/oauth-protected-resource/api/mcp/).
    # The `/api` there is MID-path (part of the resource identifier), NOT a
    # strippable prefix, so the /api/ rewrite above can't reach it. Internally
    # FastMCP serves the metadata UNDER its mount
    # (/mcp/.well-known/oauth-protected-resource/…), so prepend /mcp to the
    # origin-root path. Unauthenticated by design — discovery precedes any token.
    # Both spellings of the path must answer 200 directly. FastMCP registers the
    # metadata route WITH a trailing slash, so a client that normalizes it away
    # would otherwise get Starlette's `redirect_slashes` 307 — and that Location
    # is built from the INTERNAL mount, so it comes back as
    # `http://host/mcp/.well-known/…` (scheme downgraded, `/api` missing), the
    # app having no idea nginx stripped a prefix. OAuth clients don't follow
    # redirects during discovery; they fall back to the bare
    # /.well-known/oauth-protected-resource, get a 404, and give up without ever
    # finding the authorization server. So normalize the slash here instead.
    location /.well-known/oauth-protected-resource {
        rewrite ^(.*[^/])$ /mcp$1/ break;
        rewrite ^(.*)$ /mcp$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
