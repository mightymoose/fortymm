upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web-client:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # /api/* — strip /api and forward to the FastAPI service.
    # Matches the convention in src/api/client.ts which calls
    # ${origin}/api/...
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (FastMCP Streamable-HTTP mount at /mcp), reached via /api/mcp/. This
    # longer, more-specific prefix wins over /api/ above so the streaming-friendly
    # settings apply: buffering OFF and a long read timeout so an idle stream
    # isn't cut at nginx's default 60s. The api transport is stateless, so no
    # session affinity is needed across replicas.
    location /api/mcp/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A bare /mcp/ hit (not via /api/) reaches the same FastMCP mount directly —
    # without this it would fall through to `location /` and land on the SPA.
    location /mcp/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 9728 protected-resource metadata for the MCP OAuth Resource Server.
    # The server advertises this URL at the PUBLIC ORIGIN ROOT via the 401
    # `WWW-Authenticate: Bearer resource_metadata="…"` challenge on /mcp/, e.g.
    # https://uat.fortymm.com/.well-known/oauth-protected-resource/api/mcp/ — the
    # RFC 9728 path-insertion form. The `/api` there is MID-path (part of the
    # resource identifier), NOT a strippable prefix, so the /api/ rewrite above
    # can't reach it. Internally FastMCP serves the metadata UNDER its mount
    # (/mcp/.well-known/oauth-protected-resource/…), so prepend /mcp to the
    # origin-root path. Unauthenticated by design — discovery precedes any token.
    # Both spellings of the path must answer 200 directly. FastMCP registers the
    # metadata route WITH a trailing slash, so a client that normalizes it away
    # would otherwise get Starlette's `redirect_slashes` 307 — and that Location
    # is built from the INTERNAL mount, so it comes back as
    # `http://host/mcp/.well-known/…` (scheme downgraded, `/api` missing), the
    # app having no idea nginx stripped a prefix. OAuth clients don't follow
    # redirects during discovery; they fall back to the bare
    # /.well-known/oauth-protected-resource, get a 404, and give up without ever
    # finding the authorization server. So normalize the slash here instead.
    location /.well-known/oauth-protected-resource {
        rewrite ^(.*[^/])$ /mcp$1/ break;
        rewrite ^(.*)$ /mcp$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct API paths — FastAPI mounts routes at /v1/*; /openapi.json,
    # /docs, /redoc are FastAPI's defaults. Useful for curl / API docs.
    location ~ ^/(v1|openapi\.json|docs|redoc)(/|$) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built SPA served by nginx inside the web-client container.
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
