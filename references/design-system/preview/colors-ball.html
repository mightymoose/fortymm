<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors · Orange (actions + selection)" subtitle="The only jobs orange has" viewport="700x190" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid var(--border-subtle)}.sw b{font:500 12px var(--font-num);color:var(--fg-1)}.sw span{font:400 12px/1.3 var(--font-ui);color:var(--fg-3)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-ui);border:1px solid transparent;cursor:pointer;transition:background-color var(--dur-change) var(--ease-out),transform var(--dur-press) var(--ease-out)}.btn:active{transform:scale(0.98)}.primary{background:var(--accent);color:var(--on-accent)}.primary:hover{background:var(--accent-hover)}.primary:active{background:var(--accent-press)}.secondary{background:transparent;color:var(--fg-1);border-color:var(--border-control)}.secondary:hover{background:var(--bg-hover)}.ghost{background:transparent;color:var(--fg-2)}.ghost:hover{background:var(--bg-hover);color:var(--fg-1)}.danger{background:transparent;color:var(--danger);border-color:var(--border-control)}.btn:disabled{background:var(--bg-panel);color:var(--fg-disabled);cursor:not-allowed;transform:none}.tabs{display:flex;gap:4px;padding:4px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--border-subtle)}.tab{padding:6px 12px;border-radius:6px;font:500 14px var(--font-ui);color:var(--fg-3)}.tab.on{background:var(--accent-soft);color:var(--accent-text)}</style></head><body><div class="row" style="gap:24px"><button class="btn primary">Start match</button><div class="tabs"><span class="tab on">Tables</span><span class="tab">Schedule</span><span class="tab">Draws</span></div><button class="btn secondary" style="box-shadow:var(--focus-ring)">Focused</button></div><div class="row" style="align-items:flex-start"><div class="sw"><i style="background:#FF7A1A"></i><b>ball-500</b><span>Primary action, focus ring</span></div><div class="sw"><i style="background:#FF9A4A"></i><b>ball-400</b><span>Hover, links</span></div><div class="sw"><i style="background:#E85E00"></i><b>ball-600</b><span>Pressed</span></div><div class="sw"><i style="background:rgba(255,122,26,0.14)"></i><b>accent-soft</b><span>Selected background</span></div><div class="sw"><i style="background:#FFCFA8"></i><b>ball-200</b><span>Text on selected</span></div></div><p class="note">Orange never marks status, winners, names or scores. If something orange isn't clickable or selected, change it.</p></body></html>
