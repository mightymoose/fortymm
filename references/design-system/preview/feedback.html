<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../ui_kits/components/kit.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:20px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style></head><body><p class="fm-notice fm-notice--rest"><span data-icon="clock"></span><span><b>Lindqvist rests until 12:10.</b> Table 3 can start after that.</span></p><div class="fm-alert fm-alert--warning"><span data-icon="alert"></span><p class="fm-alert__title">Patel would get 5 minutes’ rest</p><p class="fm-alert__body">Starting at 12:05 keeps the 15-minute minimum.</p><div class="fm-alert__actions"><button class="fm-btn fm-btn--primary fm-btn--sm">Move to 12:05</button><button class="fm-btn fm-btn--secondary fm-btn--sm">Keep 11:50</button></div></div><div class="fm-alert fm-alert--error"><span data-icon="offline"></span><p class="fm-alert__title">Table 4 scorer is offline</p><p class="fm-alert__body">Last score at 11:42. Points sync when it reconnects.</p><div class="fm-alert__actions"><button class="fm-btn fm-btn--primary fm-btn--sm">Score from this device</button></div></div><div><div class="fm-toast"><span data-icon="check"></span><span class="fm-toast__msg">Chen vs Ali called to Table 1</span><button class="fm-btn fm-btn--sm fm-toast__action">Undo</button></div></div><script src="../ui_kits/components/match.js"></script><script src="../ui_kits/components/kit.js"></script><script>FM.icons()</script></body></html>
