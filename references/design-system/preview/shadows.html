<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Borders separate; one shadow floats" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.t{width:150px;height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-ui);color:var(--fg-3);box-sizing:border-box}</style></head><body><div class="row" style="gap:20px"><div class="t" style="border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);border-radius:0">Divider rows (default)</div><div class="t" style="background:var(--bg-panel);border:1px solid var(--border-subtle)">Panel</div><div class="t" style="background:var(--bg-panel);border:1px solid var(--border-subtle);box-shadow:var(--shadow-overlay)">Menu / dialog</div></div><p class="note">Lists use divider rows, not a card per item. --shadow-overlay is the only shadow and only for content that floats. There are no glow tokens.</p></body></html>
