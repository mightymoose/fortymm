<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.u{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font:500 12px var(--font-num);color:var(--fg-3)}.u i{display:block;height:12px;background:var(--ink-500);border-radius:2px}</style></head><body><div class="row" style="align-items:flex-end;gap:20px"><div class="u"><i style="width:4px"></i>4</div><div class="u"><i style="width:8px"></i>8</div><div class="u"><i style="width:12px"></i>12</div><div class="u"><i style="width:16px"></i>16</div><div class="u"><i style="width:20px"></i>20</div><div class="u"><i style="width:24px"></i>24</div><div class="u"><i style="width:32px"></i>32</div><div class="u"><i style="width:48px"></i>48</div><div class="u"><i style="width:64px"></i>64</div></div><p class="note">8–12 inside a row, 16–24 between groups, 48–64 between page sections. No unit is special.</p></body></html>
