<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sb{display:grid;grid-template-columns:1fr auto auto;gap:4px 28px;align-items:baseline;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:8px;padding:14px 20px;max-width:420px}.sb .nm{font:400 40px/1 var(--font-display);color:var(--fg-1)}.sb .g{font:600 22px var(--font-num);color:var(--fg-3)}.sb .p{font:700 44px/1 var(--font-num);color:var(--fg-1)}</style></head><body><div class="sb"><span class="nm">Nguyen</span><span class="g">2</span><span class="p">7</span><span class="nm" style="color:var(--loser)">Okafor</span><span class="g">1</span><span class="p" style="color:var(--loser)">5</span></div><p class="note">Use for surnames on venue screens read from across the hall, and the wordmark. Not for app headings, labels or body.</p></body></html>
