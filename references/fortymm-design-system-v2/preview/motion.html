<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Motion · Feedback only" subtitle="Tap +1: one flash, then stillness" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-ui);border:1px solid transparent;cursor:pointer;transition:background-color var(--dur-change) var(--ease-out),transform var(--dur-press) var(--ease-out)}.btn:active{transform:scale(0.98)}.primary{background:var(--accent);color:var(--on-accent)}.primary:hover{background:var(--accent-hover)}.primary:active{background:var(--accent-press)}.secondary{background:transparent;color:var(--fg-1);border-color:var(--border-control)}.secondary:hover{background:var(--bg-hover)}.ghost{background:transparent;color:var(--fg-2)}.ghost:hover{background:var(--bg-hover);color:var(--fg-1)}.danger{background:transparent;color:var(--danger);border-color:var(--border-control)}.btn:disabled{background:var(--bg-panel);color:var(--fg-disabled);cursor:not-allowed;transform:none}.sc{display:inline-block;font:700 64px/1 var(--font-num);padding:4px 10px;border-radius:8px;min-width:90px;text-align:center}</style></head><body><div class="row" style="gap:20px"><span id="s" class="sc">7</span><button class="btn primary" onclick="var s=document.getElementById('s');s.textContent=+s.textContent+1;s.classList.remove('score-updated');void s.offsetWidth;s.classList.add('score-updated')">+1 point</button><button class="btn ghost" onclick="var s=document.getElementById('s');s.textContent=Math.max(0,+s.textContent-1)">Undo</button></div><p class="note">Score update: ink-700 background fades out over 600ms, once. Press: 100ms scale. Hover/toggle: 160ms. Nothing loops or moves at rest. prefers-reduced-motion collapses all of it to 1ms.</p></body></html>
