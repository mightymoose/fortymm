<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type · Numbers (JetBrains Mono)" subtitle="Scores and columns of numbers only" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.note{font:400 13px/1.45 var(--font-ui);color:var(--fg-3);max-width:640px;margin:0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.t{border-collapse:collapse;font:400 14px var(--font-ui);color:var(--fg-2)}.t td{padding:4px 16px 4px 0}.t .num{color:var(--fg-1);text-align:right}</style></head><body><div class="row" style="gap:40px;align-items:center"><div class="row" style="gap:16px;align-items:baseline"><span class="score">11</span><span class="score" style="color:var(--loser)">8</span></div><table class="t"><tr><td>Nguyen, T.</td><td class="num">2,145</td><td class="rating-up">▲ +12</td></tr><tr><td>Okafor, D.</td><td class="num">1,987</td><td class="rating-down">▼ −12</td></tr><tr><td>Patel, M.</td><td class="num">1,840</td><td class="rating-up">▲ +4</td></tr></table></div><p class="note">Mono when digits need to line up or be read at a distance. Times and counts inside sentences stay in the UI face.</p></body></html>
