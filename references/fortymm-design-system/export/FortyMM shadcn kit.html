  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

----- */\n  --serve-300: #8CFFD4;\n  --serve-500: #00E29A;   /* LIVE / serve indicator */\n  --serve-700: #009968;\n\n  /* ---------- Semantic: status ---------- */\n  --win:     #00E29A;   /* same as serve — winning/advancing */\n  --loss:    #FF4D6D;   /* eliminated */\n  --warn:    #FFC43D;   /* caution / pending */\n  --info:    #6FB5FF;   /* informational */\n\n  /* ---------- Semantic: foreground tokens ---------- */\n  --fg-1: var(--chalk-50);    /* primary copy */\n  --fg-2: var(--chalk-100);   /* secondary copy */\n  --fg-3: var(--chalk-300);   /* tertiary / metadata */\n  --fg-muted: var(--chalk-500);\n  --fg-disabled: var(--ink-400);\n  --fg-accent: var(--ball-500);\n  --fg-accent-hover: var(--ball-400);\n  --fg-live: var(--serve-500);\n  --fg-inverse: var(--ink-950);\n\n  /* ---------- Semantic: background tokens ---------- */\n  --bg-app: var(--ink-950);\n  --bg-panel: var(--ink-900);\n  --bg-card: var(--ink-800);\n  --bg-raised: var(--ink-700);\n  --bg-hover: rgba(255,255,255,0.04);\n  --bg-press: rgba(255,255,255,0.02);\n  --bg-accent: var(--ball-500);\n  --bg-accent-hover: var(--ball-400);\n  --bg-accent-soft: rgba(255,122,26,0.12);\n  --bg-live-soft: rgba(0,226,154,0.14);\n\n  /* ---------- Borders ---------- */\n  --border-subtle: var(--ink-600);\n  --border-default: var(--ink-500);\n  --border-strong: var(--chalk-500);\n  --border-accent: var(--ball-500);\n\n  /* ---------- Radii ---------- */\n  --r-xs: 4px;\n  --r-sm: 6px;\n  --r-md: 10px;    /* default card radius */\n  --r-lg: 14px;\n  --r-xl: 20px;\n  --r-pill: 999px;\n\n  /* ---------- Spacing (4px base) ---------- */\n  --s-0: 0;\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 20px;\n  --s-6: 24px;\n  --s-8: 32px;\n  --s-10: 40px;   /* 40 == 40mm — brand nod */\n  --s-12: 48px;\n  --s-16: 64px;\n  --s-20: 80px;\n\n  /* ---------- Shadows (elevation) ---------- */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);\n  --shadow-md: 0 4px 12px rgba(0,0,0,0.45);\n  --shadow-lg: 0 12px 32px rgba(0,0,0,0.55);\n  --shadow-glow: 0 0 0 1px rgba(255,122,26,0.35), 0 8px 24px rgba(255,122,26,0.25);\n  --shadow-live-glow: 0 0 0 1px rgba(0,226,154,0.4), 0 0 24px rgba(0,226,154,0.3);\n  /* Inner ring used on pressed/active states */\n  --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.05);\n\n  /* ---------- Motion ---------- */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);   /* default */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-snap: cubic-bezier(0.5, 1.6, 0.4, 1);  /* for ball-bounce moments */\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 360ms;\n\n  /* ---------- Type stacks ---------- */\n  --font-ui: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-display: 'Bebas Neue', 'Space Grotesk', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---------- Type scale (px) ---------- */\n  --text-xs: 11px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 32px;\n  --text-3xl: 44px;\n  --text-4xl: 60px;\n  --text-score: 96px;   /* scoreboard moment */\n\n  /* ---------- Line heights ---------- */\n  --lh-tight: 1.05;\n  --lh-snug: 1.25;\n  --lh-normal: 1.5;\n  --lh-loose: 1.7;\n}\n\n/* =========================================================================\n   Base / Reset\n   ========================================================================= */\nhtml, body {\n  background: var(--bg-app);\n  color: var(--fg-1);\n  font-family: var(--font-ui);\n  font-size: var(--text-base);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* =========================================================================\n   Semantic type classes\n   ========================================================================= */\n.h-display {\n  font-family: var(--font-display);\n  font-size: var(--text-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n.h1 {\n  font-family: var(--font-ui);\n  font-size: var(--text-3xl);\n  font-weight: 700;\n  line-height: var(--lh-tight);\n  letter-spacing: -0.02em;\n  color: var(--fg-1);\n}\n.h2 {\n  font-family: var(--font-ui);\n  font-size: var(--text-2xl);\n  font-weight: 600;\n  line-height: var(--lh-snug);\n  letter-spacing: -0.01em;\n  color: var(--fg-1);\n}\n.h3 {\n  font-family: var(--font-ui);\n  font-size: var(--text-xl);\n  font-weight: 600;\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n}\n.h4 {\n  font-family: var(--font-ui);\n  font-size: var(--text-lg);\n  font-weight: 600;\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n}\n.p, p {\n  font-family: var(--font-ui);\n  font-size: var(--text-base);\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n}\n.caption {\n  font-family: var(--font-ui);\n  font-size: var(--text-sm);\n  color: var(--fg-3);\n  letter-spacing: 0.01em;\n}\n.overline {\n  font-family: var(--font-ui);\n  font-size: var(--text-xs);\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n.score {\n  font-family: var(--font-mono);\n  font-size: var(--text-score);\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.02em;\n  line-height: 1;\n  color: var(--fg-1);\n}\n.seed, .stat {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n  color: var(--fg-2);\n}\n.code, code {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n  color: var(--fg-2);\n  background: var(--bg-panel);\n  padding: 0.1em 0.35em;\n  border-radius: var(--r-xs);\n  border: 1px solid var(--border-subtle);\n}\n\n/* =========================================================================\n   Utility: the ball dot — brand motif\n   ========================================================================= */\n.ball-dot {\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n  b und: transparent; color: var(--ball-500); padding: 0; height: auto; text-decoration: underline; text-underline-offset: 4px; }\n  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }\n  .btn-lg { height: 48px; padding: 0 24px; font-size: 16px; }\n  .btn-icon { width: 40px; height: 40px; padding: 0; }\n\n  /* Form fields */\n  .label { font: 500 13px var(--font-ui); color: var(--fg-2); display: block; margin-bottom: 6px; letter-spacing: -0.005em; }\n  .label .req { color: var(--loss); margin-left: 4px; }\n  .input { font: 400 14px var(--font-ui); height: 40px; padding: 0 12px; width: 100%;\n           background: var(--ink-900); color: var(--fg-1); border: 1px solid var(--border-default); border-radius: var(--r-md);\n           transition: border-color var(--dur-fast); }\n  .input::placeholder { color: var(--fg-muted); }\n  .input:focus { outline: none; border-color: var(--ball-500); box-shadow: 0 0 0 3px rgba(255,122,26,0.15); }\n  .input[disabled] { opacity: 0.5; }\n  .input.error { border-color: var(--loss); }\n  .help { font-size: 12px; color: var(--fg-3); margin-top: 6px; }\n  .help.error { color: var(--loss); }\n  .textarea { font: 400 14px var(--font-ui); padding: 10px 12px; width: 100%; min-height: 96px; resize: vertical;\n              background: var(--ink-900); color: var(--fg-1); border: 1px solid var(--border-default); border-radius: var(--r-md); }\n  .textarea:focus { outline: none; border-color: var(--ball-500); box-shadow: 0 0 0 3px rgba(255,122,26,0.15); }\n\n  /* Checkbox */\n  .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--fg-1); }\n  .check .box { width: 18px; height: 18px; border-radius: var(--r-xs); border: 1px solid var(--border-default); background: var(--ink-900); display: inline-flex; align-items: center; justify-content: center; }\n  .check.on .box { background: var(--ball-500); border-color: var(--ball-500); }\n  .check.on .box svg { width: 12px; height: 12px; color: var( log { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-lg); width: 420px; }\n  .dialog h2 { margin: 0 0 6px; font: 600 18px var(--font-ui); }\n  .dialog .desc { margin: 0 0 20px; font-size: 14px; color: var(--fg-3); line-height: 1.5; }\n  .dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }\n\n  /* Sheet */\n  .sheet-mock { width: 320px; background: var(--ink-800); border-left: 1px solid var(--border-subtle); padding: 24px; box-shadow: var(--shadow-lg); }\n\n  /* Drawer (mobile bottom sheet) */\n  .drawer-mock { width: 320px; background: var(--ink-800); border-top: 1px solid var(--border-subtle); padding: 24px; border-radius: 16px 16px 0 0; }\n  .drawer-mock .grabber { width: 40px; height: 4px; background: var(--ink-500); border-radius: 999px; margin: 0 auto 16px; }\n\n  /* Dropdown menu */\n  .menu { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 4px; min-width: 200px; box-shadow: var(--shadow-lg); }\n  .menu-item { padding: 8px 10px; font: 400 13px var(--font-ui); color: var(--fg-1); border-radius: var(--r-sm); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }\n  .menu-item:hover { background: var(--bg-hover); }\n  .menu-item .kbd { font: 500 11px var(--font-mono); color: var(--fg-3); padding: 2px 5px; background: var(--ink-700); border-radius: var(--r-xs); }\n  .menu-item.dest { color: var(--loss); }\n  .menu-sep { height: 1px; background: var(--border-subtle); margin: 4px -4px; }\n  .menu-label { padding: 6px 10px; font: 500 11px var(--font-ui); color: var(--fg-3); letter-spacing: 0.05em; text-transform: uppercase; }\n\n  /* Command */\n  .cmd { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); width: 480px; box-shadow: var(--shadow-lg); overflow: hidden; }\n  .cmd-input { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 10px; }\n  .cmd-input input { background: transparent; border: 0; outline: none; flex: 1; font: 400 14px var(--font-ui); color: var(--fg-1); }\n  .cmd-list { padding: 6px; }\n  .cmd-list .menu-label { padding-top: 8px; }\n\n  /* Table */\n  table.tbl { width: 100%; border-collapse: collapse; font: 400 13px var(--font-ui); }\n  .tbl th { text-align: left; font: 500 11px var(--font-ui); color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border-default); }\n  .tbl td { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); color: var(--fg-1); }\n  .tbl tr:last-child td { border-bottom: 0; }\n  .tbl .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }\n\n  /* Calendar */\n  .cal { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; width: 280px; }\n  .cal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font: 500 13px var(--font-ui); }\n  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-family: var(--font-mono); font-size: 12px; text-align: center; }\n  .cal-grid .dow { color: var(--fg-3); padding: 6px 0; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }\n  .cal-grid .day { padding: 6px 0; border-radius: var(--r-sm); cursor: pointer; color: var(--fg-2); }\n  .cal-grid .day:hover { background: var(--bg-hover); }\n  .cal-grid .day.muted { color: var(--ink-500); }\n  .cal-grid .day.sel { background: var(--ball-500); color: var(--ink-950); font-weight: 600; }\n  .cal-grid .day.today { color: var(--ball-500); font-weight: 600; }\n\n  /* Pagination */\n  .pag { display: inline-flex; gap: 4px; align-items: center; }\n  .pag .pi { width: 36px; height: 36px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; font: 500 13px var(--font-mono); cursor: pointer; color: var(--fg-2); border: 1px solid transparent; }\n  .pag .pi:hover { background: var(--bg-hover); }\n  .pag .pi.on { background: var(--ink-700); color: var(--fg-1); border-color: var(--border-subtle); }\n\n  /* Breadcrumb */\n  .crumb { display: inline-flex; gap: 8px; align-items: center; font: 400 13px var(--font-ui); color: var(--fg-3); }\n  .crumb a { color: var(--fg-3); text-decoration: none; }\n  .crumb a:hover { color: var(--fg-1); }\n  .crumb .cur { color: var(--fg-1); }\n  .crumb .sl { color: var(--ink-500); }\n\n  /* Hover Card */\n  .hover-card { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; width: 280px; box-shadow: var(--shadow-lg); }\n\n  /* Aspect Ratio / Resizable / Scroll Area / Carousel */\n  .ar { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--ink-700), var(--ink-800)); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; color: var(--fg-3); font: 500 12px var(--font-mono); letter-spacing: 0.1em; }\n  .resz { display: flex; height: 160px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; }\n  .resz .pane { flex: 1; padding: 16px; font-size: 13px; color: var(--fg-2); display: flex; align-items: center; justify-content: center; background: var(--ink-900); }\n  .resz .handle { width: 4px; background: var(--border-subtle); cursor: col-resize; }\n  .resz .handle:hover { background: var(--ball-500); }\n  .scroll-area { height: 160px; overflow: hidden; border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; position: relative; }\n  .scroll-area .scrollbar { position: absolute; right: 4px; top: 12px; bottom: 12px; width: 6px; background: var(--ink-700); border-radius: 999px; }\n  .scroll-area .thumb { position: absolute; top: 0; left: 0; right: 0; height: 60%; background: var(--ink-500); border-radius: 999px; }\n\n  /* Carousel */\n  .carousel { display: flex; gap: 12px; overflow: hidden; padding: 4px; align-items: stretch; }\n  .carousel .slide { flex-shrink: 0; width: 200px; height: 140px; background: var(--ink-700); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font: 600 24px var(--font-display); color: var(--fg-1); letter-spacing: 0.04em; }\n  .carousel .slide.on { background: var(--ink-600); border: 2px solid var(--ball-500); }\n\n  /* OTP */\n  .otp { display: inline-flex; gap: 8px; }\n  .otp .cell { width: 40px; height: 48px; border: 1px solid var(--border-default); border-radius: var(--r-md); background: var(--ink-900); color: var(--fg-1); font: 600 18px var(--font-mono); display: flex; align-items: center; justify-content: center; }\n  .otp .cell.on { border-color: var(--ball-500); box-shadow: 0 0 0 3px rgba(255,122,26,0.15); }\n\n  /* Sonner / toast */\n  .sonner { position: relative; background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--shadow-lg); width: 380px; }\n  .sonner .sonner-body { padding-right: 28px; }\n  .sonner .ti { font: 500 14px var(--font-ui); margin: 0 0 2px; color: var(--fg-1); }\n  .sonner .td { font-size: 12px; color: var(--fg-3); margin: 0; }\n  .sonner-actions { display: flex; justify-content: flex-end; margin-top: 10px; }\n  .sonner-action { background: var(--fg-1); color: var(--ink-900); border: 0; border-radius: var(--r-sm); padding: 6px 12px; font: 500 12px var(--font-ui); cursor: pointer; }\n  .sonner-action:hover { background: var(--fg-2); }\n  .sonner-close { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 999px; border: 0; background: transparent; color: var(--fg-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; transition: background 120ms, color 120ms; }\n  .sonner-close:hover { background: var(--bg-hover); color: var(--fg-1); }\n  .sonner-success { border-left: 3px solid var(--serve-500); }\n  .sonner-error { border-left: 3px solid var(--loss); }\n  .sonner-info { border-left: 3px solid var(--info); }\n\n  /* Navigation menu */\n  .nav-menu { background: var(--ink-800); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; width: 480px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; box-shadow: var(--shadow-lg); }\n  .nav-menu .nl { padding: 8px 12px; border-radius: var(--r-sm); }\n  .nav-menu .nl:hover { background: var(--bg-hover); }\n  .nav-menu .nl .t { font: 500 13px var(--font-ui); color: var(--fg-1); margin: 0 0 2px; }\n  .nav-menu .nl .d { font-size: 12px; color: var(--fg-3); margin: 0; }\n\n  /* Menubar */\n  .menubar { display: inline-flex; background: var(--ink-900); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 4px; gap: 2px; }\n  .menubar > .mi { padding: 6px 12px; border-radius: var(--r-sm); font: 500 13px var(--font-ui); cursor: pointer; color: var(--fg-2); }\n  .menubar > .mi:hover, .menubar > .mi.on { background: var(--bg-hover); color: var(--fg-1); }\n\n  /* Form (composite) */\n  .form-field { margin-bottom: 18px; }\n\n  /* Mock window for overlay components */\n  .mock-bg { background: var(--ink-950); padding: 40px; border-radius: var(--r-md); border: 1px dashed var(--border-subtle); position: relative; min-height: 200px; display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; }\n  .mock-label { position: absolute; top: 8px; left: 12px; font: 500 10px var(--font-mono); color: var(--fg-3); letter-spacing: 0.1em; text-transform: uppercase; }\n<\u002Fstyle>\n\n<div class=\"doc\">\n  <header class=\"doc-h\">\n    <h1>SHADCN/UI · FORTYMM<\u002Fh1>\n    <span class=\"sub\">47 components · branded · static demo<\u002Fspan>\n  <\u002Fheader>\n\n  <p style=\"font-size:14px;color:var(--fg-3);max-width:680px;line-height:1.6;margin:-32px 0 56px;\">\n    Every shadcn/ui component, restyled in the FortyMM dark-arena palette. Use as visual reference when wiring real shadcn into a Next.js / Vite app —\n    these previews show the brand-aligned defaults you should configure via CSS variables in <code>globals.css<\u002Fcode> and your Tailwind theme.\n  <\u002Fp>\n\n  <!-- ============ FORMS ============ -->\n  <section class=\"cat\" id=\"forms\">\n    <h2>Forms &amp; Input<\u002Fh2>\n    <p class=\"lead\">Buttons, inputs, selectors. The interactive surface of every form. Hero color (<code>--ball-500<\u002Fcode>) is reserved for the single primary action per screen.<\u002Fp>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Button<\u002Fh3><span class=\"tag\">7 variants · 4 sizes<\u002Fspan><\u002Fdiv>\n      <div class=\"col\">\n        <div class=\"row\">\n          <button class=\"btn btn-default\">Log a match<\u002Fbutton>\n          <button class=\"btn btn-secondary\">Save draft<\u002Fbutton>\n          <button class=\"btn btn-outline\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-ghost\">Skip<\u002Fbutton>\n          <button class=\"btn btn-destructive\">Forfeit match<\u002Fbutton>\n          <button class=\"btn btn-link\">Read manifesto<\u002Fbutton>\n          <button class=\"btn btn-default\" disabled=\"\">Disabled<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"row\">\n          <button class=\"btn btn-default btn-sm\">Small<\u002Fbutton>\n          <button class=\"btn btn-default\">Default<\u002Fbutton>\n          <button class=\"btn btn-default btn-lg\">Large<\u002Fbutton>\n          <button class=\"btn btn-default btn-icon\" aria-label=\"Add\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Input · Label · Form Field<\u002Fh3><span class=\"tag\">composite<\u002Fspan><\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"form-field\">\n          <label class=\"label\">Player tag<\u002Flabel>\n          <input class=\"input\" placeholder=\"@yourname\" value=\"@nguyen.t\">\n          <div class=\"help\">Visible to opponents in match invites.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"form-field\">\n          <label class=\"label\">Email <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <input class=\"input error\" value=\"not-an-email\">\n          <div class=\"help error\">Enter a valid email address.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"form-field\">\n          <label class=\"label\">Disabled<\u002Flabel>\n          <input class=\"input\" disabled=\"\" value=\"Locked field\">\n        <\u002Fdiv>\n        <div class=\"form-field\">\n          <label class=\"label\">Search<\u002Flabel>\n          <input class=\"input\" placeholder=\"Search clubs, players, tournaments…\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Textarea<\u002Fh3><span class=\"tag\">resizable<\u002Fspan><\u002Fdiv>\n      <label class=\"label\">Match notes<\u002Flabel>\n      <textarea class=\"textarea\" placeholder=\"Add context — venue, conditions, anything memorable.\">Played in the back hall. Andrew's forehand was on fire today — three straight games to 11.<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Input OTP<\u002Fh3><span class=\"tag\">6-digit<\u002Fspan><\u002Fdiv>\n      <div class=\"otp\">\n        <span class=\"cell\">4<\u002Fspan><span class=\"cell\">0<\u002Fspan><span class=\"cell\">M<\u002Fspan>\n        <span class=\"cell on\">M<\u002Fspan><span class=\"cell\"><\u002Fspan><span class=\"cell\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Checkbox<\u002Fh3><span class=\"tag\">3 states<\u002Fspan><\u002Fdiv>\n      <div class=\"col\">\n        <label class=\"check on\"><span class=\"box\"><svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M2 6.5l2.5 2.5L10 3\"><\u002Fpath><\u002Fsvg><\u002Fspan>I agree to the rules of fair play<\u002Flabel>\n        <label class=\"check\"><span class=\"box\"><\u002Fspan>Email me match invites<\u002Flabel>\n        <label class=\"check\" style=\"opacity:0.5\"><span class=\"box\"><\u002Fspan>Disabled option<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Radio Group<\u002Fh3><span class=\"tag\">single-select<\u002Fspan><\u002Fdiv>\n      <div class=\"radio-group\">\n        <label class=\"radio on\"><span class=\"dot\"><\u002Fspan>Singles · best of 5<\u002Flabel>\n        <label class=\"radio\"><span class=\"dot\"><\u002Fspan>Singles · best of 7<\u002Flabel>\n        <label class=\"radio\"><span class=\"dot\"><\u002Fspan>Doubles · best of 5<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Switch<\u002Fh3><span class=\"tag\">on/off<\u002Fspan><\u002Fdiv>\n      <div class=\"col\">\n        <div class=\"row\" style=\"justify-content:space-between;max-width:320px;\"><span style=\"font-size:14px;\">Public profile<\u002Fspan><span class=\"switch on\"><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"justify-content:space-between;max-width:320px;\"><span style=\"font-size:14px;\">Notify me of nearby matches<\u002Fspan><span class=\"switch\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Slider<\u002Fh3><span class=\"tag\">single + range<\u002Fspan><\u002Fdiv>\n      <div class=\"col\" style=\"max-width:480px;gap:24px;\">\n        <div>\n          <div class=\"row\" style=\"justify-content:space-between;margin-bottom:8px;\"><span style=\"font-size:13px;color:var(--fg-3);\">Skill level<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--ball-500);\">1620<\u002Fspan><\u002Fdiv>\n          <div class=\"slider\"><div class=\"track\"><div class=\"fill\" style=\"width:55%\"><\u002Fdiv><div class=\"thumb\" style=\"left:55%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"row\" style=\"justify-content:space-between;margin-bottom:8px;\"><span style=\"font-size:13px;color:var(--fg-3);\">Rating range<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--ball-500);\">1400 – 1800<\u002Fspan><\u002Fdiv>\n          <div class=\"slider\"><div class=\"track\"><div class=\"fill\" style=\"left:30%;width:40%\"><\u002Fdiv><div class=\"thumb\" style=\"left:30%\"><\u002Fdiv><div class=\"thumb\" style=\"left:70%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Select<\u002Fh3><span class=\"tag\">native<\u002Fspan><\u002Fdiv>\n      <div class=\"row\">\n        <select class=\"select\"><option>Singles<\u002Foption><option>Doubles<\u002Foption><\u002Fselect>\n        <select class=\"select\" style=\"min-width:200px\"><option>Best of 5 games<\u002Foption><\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"comp\"><div class=\"comp-h\"><h3>Combobox<\u002Fh3><span class=\"tag\">searchable select · open<\u002Fspan><\u002Fdiv>\n      <div class=\"cmd\" style=\"width:340px;\">\n        <div class=\"cmd-input\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4-4\"><\u002Fpath><\u002Fsvg>\n          <input value=\"ngu\" placeholder=\"Find a player…\">\n        <\u002Fdiv>\n        <div class=\"cmd-list\">\n          <div class=\"menu-item\" style=\"background:var(--bg-hover);\">Nguyen, Tien <span style=\"color:var(--fg-3);font-family:var(--font-mono);\">1620<\u002Fspan><\u002Fdiv>\n          <div class=\"menu-item\">Nguyen, Mai <span style=\"color:var(--fg-3);font-family:var(--font-mono);\">1455<\u002Fspan><\u002Fdiv>\n          <div class=\"menu-item\">Nguyen,
