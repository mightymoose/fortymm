<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installing the app: the manifest, and the home-screen icon iPhones
         use. The icons in public/icons/ are rendered from favicon.svg by
         web-client:icons (README.md, "Installing"). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- The theme's bg-app (ink-950, src/theme/tokens.css), here too so the
         page is dark before the stylesheet loads: no white flash. -->
    <meta name="theme-color" content="#0B0D12" />
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        color-scheme: dark;
        background: #0b0d12;
      }
    </style>
    <title>fortymm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
