<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FortyMM</title>
    <!-- Every page's first paint uses these fonts, but the browser finds them
         only after main.tsx renders, so it would show fallback text first.
         Fetch them with the JS instead. -->
    <link rel="preload" href="/src/assets/fonts/SpaceGrotesk-latin-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/BebasNeue-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/JetBrainsMono-VariableFont_wght-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The app's background (--ink-950) before its CSS loads, so the first
         paint isn't white. -->
    <style>
      html {
        background: #0b0d12;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
