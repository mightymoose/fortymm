# Stripe appends the PaymentIntent's client secret to a 3-D Secure return URL
# (#1809). The access log records the request line and the Referer, and the
# page's first requests carry that URL as their Referer. Both are logged with
# the secret's value redacted. The page itself drops Stripe's params on arrival.
map $request_uri $fortymm_logged_uri {
    "~^(?<uri_pre>.*[?&]payment_intent_client_secret=)[^&]*(?<uri_post>.*)$" "${uri_pre}[redacted]${uri_post}";
    default $request_uri;
}
map $http_referer $fortymm_logged_referer {
    "~^(?<ref_pre>.*[?&]payment_intent_client_secret=)[^&]*(?<ref_post>.*)$" "${ref_pre}[redacted]${ref_post}";
    default $http_referer;
}
log_format fortymm_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $fortymm_logged_uri $server_protocol" '
                            '$status $body_bytes_sent "$fortymm_logged_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    # The redacted format above: never log a Stripe client secret (#1809).
    access_log /var/log/nginx/access.log fortymm_redacted;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset bundles — cache aggressively
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path returns index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
