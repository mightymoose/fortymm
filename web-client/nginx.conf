# Preview (web-client-public in docker-compose.yml): serves the production build and proxies /api.
server {
    # Tailscale Funnel proxies to 127.0.0.1:5173 in the shared namespace (tailscale/serve.json).
    listen 5173;
    root /usr/share/nginx/html;

    # The api serves its routes under /api, so requests pass through unchanged.
    location /api/ {
        proxy_pass http://api-public:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Vite puts a content hash in every file name under assets/, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is index.html (client-side routes) or a public/ file: always revalidate,
    # so a new build is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
